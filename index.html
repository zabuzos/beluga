<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beluga 3 Multiplayer v4</title>
<style>
body {font-family: Arial; background:#f0f0f0; display:flex; justify-content:center; flex-direction:column; align-items:center;}
#logo {max-width:230px;height:auto;margin:10px auto;}
#menu {text-align:center;margin-bottom:10px;}
#gridWrapper {border-top:2px dashed #888; margin-bottom:10px; overflow:auto;}
#grid {display:grid; grid-template-columns:repeat(18,60px);}
.cell {width:60px; height:60px; border:1px solid rgba(0,0,0,0.1); position:relative; background-image:url('img/ground.png'); background-size:cover; background-repeat:repeat; opacity:0.9;}
.panel {display:flex; gap:20px; margin:10px;}
#leftPanel, #rightPanel {width:220px;}
.buyBtn {margin-top:5px; padding:6px 12px; font-weight:bold; border-radius:6px; border:none; background:#4CAF50; color:white; cursor:pointer;}
.buyBtn:hover {background:#45a049;}
.shopCard {text-align:center; background:white; padding:10px; margin-bottom:12px; border-radius:10px;}
.shopImg {width:100%; height:110px; object-fit:contain; margin:6px 0;}
.title {font-weight:bold;margin-bottom:4px;}
.stats {font-size:14px;margin-bottom:4px;}
.price {font-weight:bold;margin-bottom:6px;}
.tabButtons {margin-top:10px;text-align:center;}
.tabButtons button {margin:0 5px; padding:6px 12px; border-radius:6px; border:none; background:#555; color:white; cursor:pointer;}
.tabButtons button.active {background:#2196F3;}
.tabContent {display:none;width:100%; max-width:700px; margin-top:10px;}
.tabContent.active {display:block;}
@media (max-width:768px){
  #grid {grid-template-columns:repeat(18,40px);}
  .cell {width:40px;height:40px;}
  #leftPanel,#rightPanel {width:45%;}
  .shopImg{height:80px;}
  .title,.stats,.price,.buyBtn{font-size:12px;}
}
</style>
</head>
<body>
<img src="img/logo.png" id="logo">

<div id="menu">
  <input type="text" id="roomInput" placeholder="Назва кімнати" />
  <select id="playerSelect">
    <option value="1">Гравець 1</option>
    <option value="2">Гравець 2</option>
  </select>
  <select id="unitSetSelect"><option value="default">Стандартний комплект</option></select>
  <button id="joinBtn">Приєднатися</button>
</div>

<div class="panel">
  <div id="leftPanel"></div>
  <div id="rightPanel"></div>
</div>

<div id="gridWrapper">
  <div id="grid"></div>
</div>

<div class="tabButtons">
  <button data-tab="game" class="active">Гра</button>
  <button data-tab="units">Юніти</button>
</div>

<div id="game" class="tabContent active">
  <button class="buyBtn" id="endTurnBtn">Закінчити хід</button>
  <button class="buyBtn" id="resetBtn">Нова гра</button>
</div>

<div id="units" class="tabContent">
  <h3>Створення комплектів юнітів</h3>
  <input type="text" id="newSetName" placeholder="Назва комплекту" />
  <button id="createSetBtn" class="buyBtn">Створити комплект</button>
  <div id="unitSetEditor" style="margin-top:10px;"></div>
</div>

<script>
const width=18,height=10;
let currentPlayer=1, playerId=1, turn=1;
const unitTypes={
  shooter:{name:"Стрілець", speed:1, atk:15, hp:50, range:3, price:50000,img1:"img/shooter_p1.png",img2:"img/shooter_p2.png"},
  infantry:{name:"Піхота", speed:3, atk:20, hp:50, range:1, price:40000,img1:"img/infantry_p1.png",img2:"img/infantry_p2.png"},
  cavalry:{name:"Кавалерія", speed:4, atk:20, hp:55, range:1, price:120000,img1:"img/cavalry_p1.png",img2:"img/cavalry_p2.png"}
};
let state={units:[], money:{1:500000,2:500000}, cities:[{x:1,y:4},{x:1,y:5},{x:16,y:4},{x:16,y:5}]};
let unitSets={default:Object.keys(unitTypes)};

function fm(n){return (n/1000)+'к';}

function createGrid(){
  const g=document.getElementById('grid'); g.innerHTML='';
  for(let y=0;y<height;y++){
    for(let x=0;x<width;x++){
      const d=document.createElement('div');
      d.className='cell';
      d.dataset.x=x; d.dataset.y=y;
      g.appendChild(d);
    }
  }
}

function render(){
  document.getElementById('leftPanel').innerHTML = "";
  document.getElementById('rightPanel').innerHTML = "";
  document.getElementById('turn')?.innerText=turn;
  document.getElementById('player')?.innerText=currentPlayer;
  renderPanels();
}

function renderPanels(){
  let html1="", html2="";
  Object.keys(unitTypes).forEach(k=>{
    const u=unitTypes[k];
    html1+=`<div class='shopCard'><div class="title">${u.name}</div><img src="${u.img1}" class="shopImg"><div class="stats">🏃${u.speed} ⚔️${u.atk} ❤️${u.hp} 🎯${u.range}</div><div class="price">💰${fm(u.price)}</div><button class="buyBtn" onclick="startBuy('${k}',1)" ${currentPlayer!==1?'disabled':''}>Купити</button></div>`;
    html2+=`<div class='shopCard'><div class="title">${u.name}</div><img src="${u.img2}" class="shopImg"><div class="stats">🏃${u.speed} ⚔️${u.atk} ❤️${u.hp} 🎯${u.range}</div><div class="price">💰${fm(u.price)}</div><button class="buyBtn" onclick="startBuy('${k}',2)" ${currentPlayer!==2?'disabled':''}>Купити</button></div>`;
  });
  document.getElementById('leftPanel').innerHTML=html1;
  document.getElementById('rightPanel').innerHTML=html2;
}

window.startBuy=function(type,player){ if(player!==playerId) return; }

window.resetState=function(){ state={units:[], money:{1:500000,2:500000}, cities:[{x:1,y:4},{x:1,y:5},{x:16,y:4},{x:16,y:5}]}; turn=1; currentPlayer=1; render(); }

document.getElementById('resetBtn').onclick = window.resetState;
document.getElementById('endTurnBtn').onclick = function(){ currentPlayer=(currentPlayer===1?2:1); if(currentPlayer===1) turn++; state.money[currentPlayer]+=100000; render(); }
document.getElementById('joinBtn').onclick = function(){ playerId=parseInt(document.getElementById('playerSelect').value); createGrid(); render(); }

// вкладки
document.querySelectorAll('.tabButtons button').forEach(btn=>{
  btn.onclick=function(){
    document.querySelectorAll('.tabButtons button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tabContent').forEach(tc=>tc.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
  }
});

// створення комплектів
document.getElementById('createSetBtn').onclick=function(){
  const name=document.getElementById('newSetName').value.trim();
  if(!name){alert("Введіть назву комплекту");return;}
  if(unitSets[name]){alert("Такий комплект вже існує");return;}
  unitSets[name]=[];
  document.getElementById('unitSetSelect').appendChild(new Option(name,name));
  showUnitEditor(name);
}

function showUnitEditor(setName){
  const editor=document.getElementById('unitSetEditor');
  editor.innerHTML=`<h4>Редагування комплекту: ${setName}</h4>
  Назва: <input type="text" id="unitName" /><br>
  🏃: <input type="number" id="unitSpeed" value="1" /><br>
  ⚔️: <input type="number" id="unitAtk" value="10" /><br>
  ❤️: <input type="number" id="unitHp" value="50" /><br>
  🎯: <input type="number" id="unitRange" value="1" /><br>
  💰: <input type="number" id="unitPrice" value="10000" /><br>
  Картинка: <input type="text" id="unitImg" placeholder="img/unit.png" /><br>
  <button id="addUnitBtn" class="buyBtn">Додати юніта</button>`;
  document.getElementById('addUnitBtn').onclick=function(){
    const u={
      name:document.getElementById('unitName').value,
      speed:parseInt(document.getElementById('unitSpeed').value),
      atk:parseInt(document.getElementById('unitAtk').value),
      hp:parseInt(document.getElementById('unitHp').value),
      range:parseInt(document.getElementById('unitRange').value),
      price:parseInt(document.getElementById('unitPrice').value),
      img:document.getElementById('unitImg').value
    };
    if(!u.name){alert("Введіть назву юніта"); return;}
    unitSets[setName].push(u);
    showUnitEditor(setName);
  }
}

createGrid(); render();
</script>
</body>
</html>
