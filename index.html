<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beluga 3 Multiplayer v1</title>
<style>
  body {
    font-family: Arial;
    background:#f0f0f0;
    display:flex;
    justify-content:center;
    gap:20px;
    margin:0;
    padding:20px;
    min-height:100vh;
  }

  /* GRID */
  #grid {
    display:grid;
    grid-template-columns: repeat(18, 60px);
    grid-auto-rows: 60px;
    background: white;
    border: 1px solid #ccc;
  }

  .cell {
    width:60px;
    height:60px;
    border:1px solid #ccc;
    position:relative;
    box-sizing: border-box;
    user-select:none;
  }

  .p1 { background:#d0f0ff; }
  .p2 { background:#ffd0d0; }

  .move { background:rgba(0,255,0,0.3); }
  .future { background:rgba(255,255,0,0.3); }

  .attackBorder {
    outline:3px solid red;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><text y="24" font-size="24">⚔️</text></svg>') 0 24, auto;
  }

  .city { background:gold; }
  .selected { outline:3px solid black; }

  /* ЮНІТИ */
  .unitImg {
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:6px;
  }

  .unitP1 { outline:3px solid #2196F3; }
  .unitP2 { outline:3px solid #f44336; }

  .hp {
    position:absolute;
    bottom:2px;
    right:2px;
    font-size:12px;
    color:white;
    background:rgba(0,0,0,0.6);
    padding:2px;
    border-radius:3px;
    pointer-events:none;
  }

  .mp {
    position:absolute;
    top:2px;
    left:2px;
    font-size:11px;
    background:white;
    padding:1px 3px;
    border-radius:4px;
    pointer-events:none;
  }

  /* ПАНЕЛІ */
  .panel { width:220px; background:white; border-radius:10px; padding:10px; max-height:600px; overflow-y:auto; }

  .card {
    background:white;
    padding:10px;
    margin-bottom:12px;
    border-radius:10px;
    box-shadow: 0 0 5px rgba(0,0,0,0.1);
  }

  /* SHOP */
  .shopCard { text-align:center; }

  .shopImg {
    width:100%;
    height:110px;
    object-fit:contain;
    margin:6px 0;
  }

  .title {
    font-weight:bold;
    margin-bottom:4px;
  }

  .stats {
    font-size:14px;
    margin-bottom:4px;
  }

  .price {
    font-weight:bold;
    margin-bottom:6px;
  }

  /* КНОПКИ */
  .buyBtn {
    background: linear-gradient(180deg, #4CAF50, #2e7d32);
    border: none;
    border-radius: 8px;
    padding: 8px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    width:100%;
  }

  .buyBtn:hover { transform: scale(1.05); }
  .buyBtn:active { transform: scale(0.95); }

  .buyBtn:disabled {
    background: #999;
    cursor: not-allowed;
    transform:none;
  }

  /* Лобі */
  #lobby {
    background: white;
    padding: 20px;
    border-radius: 10px;
    width: 350px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  #gameArea {
    display: none;
    flex-direction: row;
    gap: 20px;
  }

  button {
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- Лобі для вибору кімнати та гравця -->
<div id="lobby">
  <h2>Beluga 3 — Multiplayer Lobby</h2>
  <label>
    Введіть назву кімнати:
    <input type="text" id="roomInput" placeholder="Room name" />
  </label>

  <label>
    Виберіть гравця:
    <select id="playerSelect">
      <option value="1">Гравець 1</option>
      <option value="2">Гравець 2</option>
    </select>
  </label>

  <button id="joinBtn" class="buyBtn">Підключитись</button>
  <div id="status" style="color:red; margin-top:10px;"></div>
</div>

<!-- Основна ігрова зона -->
<div id="gameArea">
  <div class="panel" id="leftPanel"></div>
  <div style="display:flex; flex-direction: column; align-items:center; gap:8px;">

    <h3 style="text-align:center; margin:0;">
      Хід: <span id="turn"></span> |
      Гравець: <span id="player"></span><br />
      💰 P1: <span id="money1"></span> | P2: <span id="money2"></span>
    </h3>

    <div id="grid"></div>

    <button onclick="endTurn()" class="buyBtn" style="width:200px;">Закінчити хід</button>
    <button onclick="newGame()" class="buyBtn" style="width:200px; background:#2196F3; margin-top:6px;">Нова гра</button>
  </div>
  <div class="panel" id="rightPanel"></div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, get, update } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

  // Firebase config (твій)
  const firebaseConfig = {
    apiKey: "AIzaSyBM6L4pO6cCkCX6mhChNG0-5RxKYOIV1fY",
    authDomain: "beluga-a7197.firebaseapp.com",
    projectId: "beluga-a7197",
    storageBucket: "beluga-a7197.firebasestorage.app",
    messagingSenderId: "1019986290981",
    appId: "1:1019986290981:web:1a0685a543fa63e5a152cc",
    measurementId: "G-09QQGZZ584"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // --- Глобальні змінні ---
  const width = 18;
  const height = 10;

  let room = null;
  let playerNum = null;

  // Стани гри, ініціалізуються при старті або підключенні
  let state = null;
  let currentPlayer = 1;
  let turn = 1;
  let selectedUnit = null;
  let buyMode = null;

  // DOM елементи
  const lobby = document.getElementById('lobby');
  const gameArea = document.getElementById('gameArea');
  const turnEl = document.getElementById('turn');
  const playerEl = document.getElementById('player');
  const money1El = document.getElementById('money1');
  const money2El = document.getElementById('money2');
  const leftPanel = document.getElementById('leftPanel');
  const rightPanel = document.getElementById('rightPanel');
  const gridEl = document.getElementById('grid');
  const statusEl = document.getElementById('status');

  // --- Типи юнітів ---
  const unitTypes = {
    shooter:{
      name:"Стрілець",
      speed:1, atk:15, hp:50, range:3, price:50000,
      img1:"img/shooter_p1.png",
      img2:"img/shooter_p2.png"
    },
    infantry:{
      name:"Піхота",
      speed:3, atk:20, hp:50, range:1, price:40000,
      img1:"img/infantry_p1.png",
      img2:"img/infantry_p2.png"
    },
    cavalry:{
      name:"Кавалерія",
      speed:4, atk:20, hp:55, range:1, price:120000,
      img1:"img/cavalry_p1.png",
      img2:"img/cavalry_p2.png"
    }
  };

  // --- Ініціалізація нової гри ---
  function createNewGameState(){
    return {
      units: [],
      money: {1:500000, 2:500000},
      cities:[
        {x:1,y:4},{x:1,y:5},
        {x:16,y:4},{x:16,y:5}
      ],
      currentPlayer: 1,
      turn: 1
    };
  }

  // --- Створення сітки ---
  function createGrid(){
    gridEl.innerHTML = '';
    for(let y=0; y<height; y++){
      for(let x=0; x<width; x++){
        let cell = document.createElement('div');
        cell.className = 'cell ' + (x < 9 ? 'p1' : 'p2');
        cell.dataset.x = x;
        cell.dataset.y = y;
        cell.onclick = () => cellClick(x,y);
        gridEl.appendChild(cell);
      }
    }
  }

  // --- Отримати клітинку ---
  function getCell(x,y){
    return document.querySelector(`.cell[data-x='${x}'][data-y='${y}']`);
  }

  // --- Форматування грошей ---
  function fm(n){ return (n/1000)+'к'; }

  // --- Рендер гри ---
  function render(){
    if(!state) return;

    turnEl.innerText = state.turn;
    playerEl.innerText = playerNum;
    money1El.innerText = fm(state.money[1]);
    money2El.innerText = fm(state.money[2]);

    // Очистити клітинки
    document.querySelectorAll('.cell').forEach(c => {
      c.innerHTML = '';
      c.classList.remove('move','future','attackBorder','selected','city');
    });

    // Показати міста
    state.cities.forEach(c => {
      let cell = getCell(c.x,c.y);
      cell.classList.add('city');
      let icon = document.createElement('div');
      icon.innerText = "🏰";
      icon.style.position = "absolute";
      icon.style.top = "50%";
      icon.style.left = "50%";
      icon.style.transform = "translate(-50%, -50%)";
      icon.style.fontSize = "26px";
      cell.appendChild(icon);
    });

    // Показати юнітів
    state.units.forEach(u => {
      let cell = getCell(u.x, u.y);

      let img = document.createElement('img');
      img.src = u.owner === 1 ? unitTypes[u.type].img1 : unitTypes[u.type].img2;
      img.className = 'unitImg ' + (u.owner === 1 ? 'unitP1' : 'unitP2');
      cell.appendChild(img);

      let hp = document.createElement('div');
      hp.className = 'hp';
      hp.innerText = u.hp;
      cell.appendChild(hp);

      let mp = document.createElement('div');
      mp.className = 'mp';
      mp.innerText = u.movePoints;
      cell.appendChild(mp);

      if(selectedUnit === u) cell.classList.add('selected');
    });

    if(selectedUnit){
      highlightMoves(selectedUnit);
      highlightAttacks(selectedUnit);
    }

    renderPanels();
  }

  // --- Показати панелі магазину ---
  function renderPanels(){
    if(!state) return;

    let html1 = '';
    let html2 = '';

    Object.keys(unitTypes).forEach(k => {
      let u = unitTypes[k];

      html1 += `
      <div class='card shopCard'>
        <div class="title">${u.name}</div>
        <img src="${u.img1}" class="shopImg" />
        <div class="stats">🏃 ${u.speed} ⚔️ ${u.atk} ❤️ ${u.hp} 🎯 ${u.range}</div>
        <div class="price">💰 ${fm(u.price)}</div>
        <button class="buyBtn" onclick="startBuy('${k}',1)" ${playerNum!==1?'disabled':''}>Купити</button>
      </div>`;

      html2 += `
      <div class='card shopCard'>
        <div class="title">${u.name}</div>
        <img src="${u.img2}" class="shopImg" />
        <div class="stats">🏃 ${u.speed} ⚔️ ${u.atk} ❤️ ${u.hp} 🎯 ${u.range}</div>
        <div class="price">💰 ${fm(u.price)}</div>
        <button class="buyBtn" onclick="startBuy('${k}',2)" ${playerNum!==2?'disabled':''}>Купити</button>
      </div>`;
    });

    leftPanel.innerHTML = html1;
    rightPanel.innerHTML = html2;
  }

  // --- Почати купівлю ---
  function startBuy(type, player){
    if(player !== playerNum) return;
    buyMode = type;
  }

  function isOwnSide(x){
    return playerNum === 1 ? x < 9 : x >= 9;
  }

  // --- Обробка кліку на клітинку ---
  function cellClick(x,y){
    if(!state) return;

    let unit = state.units.find(u => u.x === x && u.y === y);

    if(buyMode){
      if(unit || !isOwnSide(x)) return;

      let u = unitTypes[buyMode];
      if(state.money[playerNum] < u.price) return;

      state.money[playerNum] -= u.price;

      state.units.push({
        x, y,
        owner: playerNum,
        type: buyMode,
        hp: u.hp,
        movePoints: 0,
        attacked: true
      });

      buyMode = null;
      syncState();
      return;
    }

    if(unit && unit.owner === playerNum){
      selectedUnit = unit;
      render();
      return;
    }

    if(unit && unit.owner !== playerNum && selectedUnit && !selectedUnit.attacked){
      attackUnit(selectedUnit, unit);
      syncState();
      return;
    }

    if(selectedUnit && selectedUnit.movePoints > 0){
      if(state.units.some(u => u.x === x && u.y === y)) return;
      moveUnit(selectedUnit, x, y);
      syncState();
    }
  }

  // --- Переміщення юніта ---
  function moveUnit(u, x, y){
    let dx = Math.abs(u.x - x);
    let dy = Math.abs(u.y - y);
    let dist = Math.max(dx, dy);

    if(dist <= u.movePoints){
      u.movePoints -= dist;
      u.x = x;
      u.y = y;
    }
  }

  // --- Атака ---
  function attackUnit(a, d){
    let t = unitTypes[a.type];
    let dx = Math.abs(a.x - d.x);
    let dy = Math.abs(a.y - d.y);

    if(Math.max(dx, dy) <= t.range){
      d.hp -= t.atk;
      a.attacked = true;

      if(d.hp <= 0){
        state.units = state.units.filter(u => u !== d);
      }
    }
  }

  // --- Підсвітка ходів ---
  function highlightMoves(u){
    let s = u.movePoints;

    for(let dx = -s; dx <= s; dx++){
      for(let dy = -s; dy <= s; dy++){
        let nx = u.x + dx;
        let ny = u.y + dy;

        if(nx >= 0 && ny >= 0 && nx < width && ny < height &&
           Math.max(Math.abs(dx), Math.abs(dy)) <= s){

          let cell = getCell(nx, ny);
          if(u.movePoints > 0) cell.classList.add('move');
          else cell.classList.add('future');
        }
      }
    }
  }

  // --- Підсвітка атак ---
  function highlightAttacks(u){
    let r = unitTypes[u.type].range;

    state.units.forEach(e => {
      if(e.owner !== playerNum && !u.attacked){
        let dx = Math.abs(e.x - u.x);
        let dy = Math.abs(e.y - u.y);

        if(Math.max(dx, dy) <= r){
          getCell(e.x, e.y).classList.add('attackBorder');
        }
      }
    });
  }

  // --- Закінчити хід ---
  function endTurn(){
    if(!state) return;

    state.currentPlayer = state.currentPlayer === 1 ? 2 : 1;
    if(state.currentPlayer === 1) state.turn++;

    // Додати гроші поточному гравцю
    state.money[state.currentPlayer] += 100000;

    // Відновити рух і атаку юнітам поточного гравця
    state.units
