<!DOCTYPE html>

<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beluga Online</title>

<style>
body {
  font-family: Arial;
  background:#f0f0f0;
  display:flex;
  justify-content:center;
  gap:20px;
}

#grid {
  display:grid;
  grid-template-columns: repeat(18, 60px);
}

.cell {
  width:60px;
  height:60px;
  border:1px solid #ccc;
  position:relative;
}

.p1 { background:#d0f0ff; }
.p2 { background:#ffd0d0; }

.city { background:gold; }
.selected { outline:3px solid black; }

.unitImg {
  width:100%;
  height:100%;
  object-fit:contain;
}

.panel { width:220px; }

.buyBtn {
  width:100%;
  padding:8px;
  margin-top:5px;
  background:#4CAF50;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

.buyBtn:disabled {
  background:#999;
}
</style>

</head>

<body>

<div class="panel" id="leftPanel"></div>

<div>
<h3>
Хід: <span id="turn"></span> |
Гравець: <span id="player"></span><br>
💰 P1: <span id="money1"></span> |
P2: <span id="money2"></span>
</h3>

<div id="grid"></div>
<button onclick="endTurn()" class="buyBtn">Закінчити хід</button>
</div>

<div class="panel" id="rightPanel"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

// --- CONFIG ---
const firebaseConfig = {
  apiKey: "AIzaSyBM6L4pO6cCkCX6mhChNG0-5RxKYOIV1fY",
  authDomain: "beluga-a7197.firebaseapp.com",
  projectId: "beluga-a7197",
  storageBucket: "beluga-a7197.firebasestorage.app",
  messagingSenderId: "1019986290981",
  appId: "1:1019986290981:web:1a0685a543fa63e5a152cc",
  measurementId: "G-09QQGZZ584"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// --- ROOM ---
let roomId = prompt("ID кімнати (наприклад 123)");
let myPlayer = Number(prompt("Ти гравець 1 чи 2?"));

// --- GAME ---
const width = 18;
const height = 10;

let currentPlayer = 1;
let turn = 1;
let selectedUnit = null;
let buyMode = null;

const unitTypes = {
  shooter:{name:"Стрілець",speed:1,atk:15,hp:50,range:3,price:50000,img1:"img/shooter_p1.png",img2:"img/shooter_p2.png"},
  infantry:{name:"Піхота",speed:3,atk:20,hp:50,range:1,price:40000,img1:"img/infantry_p1.png",img2:"img/infantry_p2.png"},
  cavalry:{name:"Кавалерія",speed:4,atk:20,hp:55,range:1,price:120000,img1:"img/cavalry_p1.png",img2:"img/cavalry_p2.png"}
};

let state = {
  units: [],
  money:{1:500000,2:500000},
  cities:[{x:1,y:4},{x:1,y:5},{x:16,y:4},{x:16,y:5}]
};

// --- FIREBASE ---
function saveGame(){
  set(ref(db,"rooms/"+roomId),{
    state,
    currentPlayer,
    turn
  });
}

onValue(ref(db,"rooms/"+roomId),(snap)=>{
  let data = snap.val();
  if(!data) return;

  state = data.state;
  currentPlayer = data.currentPlayer;
  turn = data.turn;

  render();
});

// --- GRID ---
function createGrid(){
  let g=document.getElementById('grid');
  for(let y=0;y<height;y++){
    for(let x=0;x<width;x++){
      let d=document.createElement('div');
      d.className='cell '+(x<9?'p1':'p2');
      d.onclick=()=>cellClick(x,y);
      d.dataset.x=x;
      d.dataset.y=y;
      g.appendChild(d);
    }
  }
}

function getCell(x,y){
  return document.querySelector(`.cell[data-x='${x}'][data-y='${y}']`);
}

// --- RENDER ---
function render(){
  turnEl.innerText=turn;
  playerEl.innerText=currentPlayer;
  money1.innerText=state.money[1];
  money2.innerText=state.money[2];

  document.querySelectorAll('.cell').forEach(c=>{
    c.innerHTML='';
    c.classList.remove('selected','city');
  });

  state.cities.forEach(c=>{
    let cell=getCell(c.x,c.y);
    cell.classList.add('city');

    let icon=document.createElement('div');
    icon.innerText="🏰";
    icon.style.position="absolute";
    icon.style.top="50%";
    icon.style.left="50%";
    icon.style.transform="translate(-50%,-50%)";
    cell.appendChild(icon);
  });

  state.units.forEach(u=>{
    let cell=getCell(u.x,u.y);

    let img=document.createElement('img');
    img.src = u.owner===1 ? unitTypes[u.type].img1 : unitTypes[u.type].img2;
    img.className='unitImg';

    cell.appendChild(img);
  });

  renderPanels();
}

// --- SHOP ---
function renderPanels(){

  let html1='', html2='';

  Object.keys(unitTypes).forEach(k=>{
    let u=unitTypes[k];

    html1+=`
    <div>
      <b>${u.name}</b><br>
      <img src="${u.img1}" width="100"><br>
      💰${u.price}<br>
      <button class="buyBtn"
        onclick="startBuy('${k}',1)"
        ${currentPlayer!==1?'disabled':''}>
        Купити
      </button>
    </div>`;

    html2+=`
    <div>
      <b>${u.name}</b><br>
      <img src="${u.img2}" width="100"><br>
      💰${u.price}<br>
      <button class="buyBtn"
        onclick="startBuy('${k}',2)"
        ${currentPlayer!==2?'disabled':''}>
        Купити
      </button>
    </div>`;
  });

  leftPanel.innerHTML=html1;
  rightPanel.innerHTML=html2;
}

// --- BUY ---
window.startBuy = function(type,player){
  if(player!==currentPlayer || myPlayer!==currentPlayer) return;
  buyMode=type;
}

// --- CLICK ---
function cellClick(x,y){
  if(myPlayer!==currentPlayer) return;

  if(buyMode){
    let u=unitTypes[buyMode];
    if(state.money[currentPlayer]<u.price) return;

    state.money[currentPlayer]-=u.price;

    state.units.push({
      x,y,
      owner:currentPlayer,
      type:buyMode
    });

    buyMode=null;
    saveGame();
    return;
  }
}

// --- TURN ---
window.endTurn = function(){
  if(myPlayer!==currentPlayer) return;

  currentPlayer = currentPlayer===1 ? 2 : 1;
  if(currentPlayer===1) turn++;

  state.money[currentPlayer]+=100000;

  saveGame();
}

// --- START ---
const turnEl=document.getElementById('turn');
const playerEl=document.getElementById('player');
const money1=document.getElementById('money1');
const money2=document.getElementById('money2');

createGrid();
render();

</script>

</body>
</html>
