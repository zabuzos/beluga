<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beluga 3 Multiplayer</title>
<style>
body {font-family: Arial;background:#f0f0f0;display:flex;justify-content:center;gap:20px;flex-wrap: wrap;}
#grid {display:grid;grid-template-columns: repeat(18, 60px);} 
.cell { width:60px;height:60px;border:1px solid rgba(0,0,0,0.1);position:relative;
  background-image: url('img/ground.png'); background-size: cover; background-repeat: repeat;
  opacity: 0.9; 
}
.panel { width:220px; }
.divider {border-right: 4px dashed black !important;}
#logo {max-width: 230px;height:auto;margin-bottom: 10px;align:center;}
.hitFlash {animation: hitFlashAnim 0.2s ease;}
@keyframes hitFlashAnim {0% { background: rgba(255,0,0,0.7);} 100% { background: transparent; }}
.move { background:rgba(0,255,0,0.3); } 
.future { background:rgba(255,255,0,0.3); }
.attackBorder { outline:3px solid red; cursor:pointer; }
.attackBorder:hover { cursor:pointer;}
.city { background:gold; } .selected { outline:3px solid black; }
.unitImg {width:100%;height:100%;object-fit:contain;border-radius:6px;}
.unitP1 { outline:3px solid #2196F3; } .unitP2 { outline:3px solid #f44336; }
.hp {position:absolute;bottom:2px;right:2px;font-size:12px;color:white;background:rgba(0,0,0,0.6);padding:2px;}
.mp {position:absolute;top:2px;left:2px;font-size:11px;background:white;padding:1px 3px;border-radius:4px;}
.card {background:white;padding:10px;margin-bottom:12px;border-radius:10px;}
.shopCard { text-align:center; }
.shopImg {width:100%;height:110px;object-fit:contain;margin:6px 0;}
.title {font-weight:bold;margin-bottom:4px;} .stats {font-size:14px;margin-bottom:4px;} .price {font-weight:bold;margin-bottom:6px;}
.buyBtn {background: linear-gradient(180deg, #4CAF50, #2e7d32);border:none;border-radius:8px;padding:8px;color:white;font-weight:bold;cursor:pointer;width:100%;}
.buyBtn:hover { transform: scale(1.05); }
.buyBtn:active { transform: scale(0.95); }
.buyBtn:disabled {background:#999;cursor:not-allowed;}
#menu {width:100%;text-align:center;margin-bottom:10px;}
#turnPanel {text-align:center;margin-bottom:10px;}
</style>
</head>

<body>
<div><img src="img/logo.png" id="logo"></div>

<!-- Вкладки -->
<div id="menu">
  <button onclick="showTab('game')">Гра</button>
  <button onclick="showTab('units')">Юніти</button>
</div>

<!-- GAME TAB -->
<div id="gameTab">
  <div id="menuGame">
    <input type="text" id="roomInput" placeholder="Назва кімнати" />
    <select id="playerSelect">
      <option value="1">Гравець 1</option>
      <option value="2">Гравець 2</option>
    </select>
    <button id="joinBtn">Приєднатися</button>
  </div>

  <div class="panel" id="leftPanel"></div>

  <div>
    <div id="turnPanel">
      <h3>
        Хід: <span id="turn"></span> |
        Гравець: <span id="player"></span><br>
        💰 P1: <span id="money1"></span> |
        P2: <span id="money2"></span>
      </h3>
    </div>

    <div id="gridWrapper">
      <div id="grid"></div>
    </div>

    <button onclick="endTurn()" class="buyBtn" id="endTurnBtn">Закінчити хід</button>
    <button onclick="resetState()" class="buyBtn" style="margin-top:10px;">Нова гра</button>
  </div>

  <div class="panel" id="rightPanel"></div>
</div>

<!-- UNITS TAB -->
<div id="unitsTab" style="display:none;">
  <h3>Адмінка юнітів</h3>
  <input type="text" id="unitSetName" placeholder="Назва комплекту">
  <button onclick="createUnitSet()">Створити комплект</button>
  <div id="unitSetsContainer" style="margin-top:10px;"></div>
  <hr>
  <button onclick="applyUnitSet()">Застосувати обраний комплект у гру</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBM6L4pO6cCkCX6mhChNG0-5RxKYOIV1fY",
  authDomain: "beluga-a7197.firebaseapp.com",
  databaseURL: "https://beluga-a7197-default-rtdb.firebaseio.com",
  projectId: "beluga-a7197",
  storageBucket: "beluga-a7197.appspot.com",
  messagingSenderId: "1019986290981",
  appId: "1:1019986290981:web:1a0685a543fa63e5a152cc"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ================= GLOBAL =================
window.showTab = function(tab){
  document.getElementById('gameTab').style.display = (tab==='game')?'block':'none';
  document.getElementById('unitsTab').style.display = (tab==='units')?'block':'none';
}

window.resetState = function(){
  state = { units:[], money:{1:500000,2:500000}, cities:[{x:1,y:4},{x:1,y:5},{x:16,y:4},{x:16,y:5}] };
  turn = 1; currentPlayer = 1; selectedUnit=null; buyMode=null;
  saveState(); render();
}

// ================= GAME VARIABLES =================
const width=18,height=10;
let currentPlayer=1,playerId=1,turn=1,selectedUnit=null,buyMode=null,room="";
let unitTypes = {
  shooter:{name:"Стрілець", speed:1, atk:15, hp:50, range:3, price:50000,img1:"img/shooter_p1.png",img2:"img/shooter_p2.png"},
  infantry:{name:"Піхота", speed:3, atk:20, hp:50, range:1, price:40000,img1:"img/infantry_p1.png",img2:"img/infantry_p2.png"},
  cavalry:{name:"Кавалерія", speed:4, atk:20, hp:55, range:1, price:120000,img1:"img/cavalry_p1.png",img2:"img/cavalry_p2.png"}
};
let state = { units:[], money:{1:500000,2:500000}, cities:[{x:1,y:4},{x:1,y:5},{x:16,y:4},{x:16,y:5}] };
let unitSets={},currentSet="";

const gridEl=document.getElementById('grid');
const leftPanel=document.getElementById('leftPanel');
const rightPanel=document.getElementById('rightPanel');
const turnEl=document.getElementById('turn');
const playerEl=document.getElementById('player');
const money1=document.getElementById('money1');
const money2=document.getElementById('money2');

// ================= INIT GRID =================
function createGrid(){
  gridEl.innerHTML='';
  for(let y=0;y<height;y++){
    for(let x=0;x<width;x++){
      let d=document.createElement('div'); d.className='cell';
      if(x===8) d.classList.add('divider');
      d.dataset.x=x; d.dataset.y=y;
      d.onclick=()=>cellClick(x,y);
      gridEl.appendChild(d);
    }
  }
}
createGrid();

// ================= UTILS =================
function fm(n){ return (n/1000)+'к'; }
function getCell(x,y){ return document.querySelector(`.cell[data-x='${x}'][data-y='${y}']`); }
function saveState(){ set(ref(db,'rooms/'+room), state); }
function loadState(r){ onValue(ref(db,'rooms/'+r),(snap)=>{ state = snap.val(); render(); }); }

// ================= UNIT SET =================
window.createUnitSet = function(){
  const name = document.getElementById('unitSetName').value.trim();
  if(!name) return alert('Введіть назву комплекту');
  if(unitSets[name]) return alert('Такий комплект вже існує');
  unitSets[name]=[]; currentSet=name; renderUnitSets();
}
function renderUnitSets(){
  const container=document.getElementById('unitSetsContainer'); container.innerHTML='';
  Object.keys(unitSets).forEach(setName=>{
    const div=document.createElement('div'); div.className='card';
    div.innerHTML=`<h4>${setName}</h4><button onclick="addUnit('${setName}')">Додати юніта</button>
      <div id="units_${setName}"></div>`; container.appendChild(div);
    renderUnits(setName);
  });
}
window.addUnit = function(setName){
  const name=prompt("Назва юніта:"), speed=parseInt(prompt("Швидкість:")), atk=parseInt(prompt("Атака:")),
  hp=parseInt(prompt("HP:")), range=parseInt(prompt("Дальність:")), price=parseInt(prompt("Ціна:")), img=prompt("URL картинки:");
  unitSets[setName].push({name,speed,atk,hp,range,price,img}); renderUnits(setName);
}
function renderUnits(setName){
  const container=document.getElementById(`units_${setName}`); container.innerHTML='';
  unitSets[setName].forEach(u=>{
    const div=document.createElement('div'); div.className='card';
    div.innerHTML=`<strong>${u.name}</strong><br> 🏃 ${u.speed} ⚔️ ${u.atk} ❤️ ${u.hp} 🎯 ${u.range} 💰 ${u.price}<br>
      <img src="${u.img}" style="width:80px;height:80px;object-fit:contain">`; container.appendChild(div);
  });
}
window.applyUnitSet=function(){
  if(!currentSet) return alert("Оберіть комплект!"); const uArr=unitSets[currentSet];
  if(!uArr || uArr.length===0) return alert("Комплект порожній!");
  uArr.forEach(u=>{
    const key=u.name.replace(/\s+/g,'_').toLowerCase();
    unitTypes[key]={name:u.name,speed:u.speed,atk:u.atk,hp:u.hp,range:u.range,price:u.price,img1:u.img,img2:u.img};
  });
  alert("Комплект застосовано! Юніти доступні у магазині."); renderPanels();
}

// ================= GAME LOGIC =================
function render(){
  turnEl.innerText=turn; playerEl.innerText=currentPlayer; money1.innerText=fm(state.money[1]); money2.innerText=fm(state.money[2]);
  document.getElementById('endTurnBtn').disabled = currentPlayer!==playerId;
  document.querySelectorAll('.cell').forEach(c=>{ c.innerHTML=''; c.classList.remove('move','future','attackBorder','selected','city'); });
  state.cities.forEach(c=>{
    let cell=getCell(c.x,c.y); cell.classList.add('city');
    let icon=document.createElement('div'); icon.innerText="🏰";
    icon.style.position="absolute"; icon.style.top="50%"; icon.style.left="50%";
    icon.style.transform="translate(-50%,-50%)"; icon.style.fontSize="26px";
    cell.appendChild(icon);
  });
  state.units.forEach(u=>{
    let cell=getCell(u.x,u.y); let img=document.createElement('img');
    img.src = u.owner===1 ? unitTypes[u.type].img1 : unitTypes[u.type].img2;
    img.className='unitImg '+(u.owner===1?'unitP1':'unitP2'); cell.appendChild(img);
    let hp=document.createElement('div'); hp.className='hp'; hp.innerText=u.hp; cell.appendChild(hp);
    let mp=document.createElement('div'); mp.className='mp'; mp.innerText=u.movePoints; cell.appendChild(mp);
    if(u===selectedUnit) cell.classList.add('selected');
  });
  renderPanels();
}
function renderPanels(){
  let html1='', html2='';
  Object.keys(unitTypes).forEach(k=>{
    let u=unitTypes[k];
    html1+=`<div class='card shopCard'><div class="title">${u.name}</div>
      <img src="${u.img1}" class="shopImg">
      <div class="stats">🏃 ${u.speed} ⚔️ ${u.atk} ❤️ ${u.hp} 🎯 ${u.range}</div>
      <div class="price">💰 ${fm(u.price)}</div>
      <button class="buyBtn" onclick="startBuy('${k}',1)" ${currentPlayer!==1?'disabled':''}>Купити</button></div>`;
    html2+=`<div class='card shopCard'><div class="title">${u.name}</div>
      <img src="${u.img2}" class="shopImg">
      <div class="stats">🏃 ${u.speed} ⚔️ ${u.atk} ❤️ ${u.hp} 🎯 ${u.range}</div>
      <div class="price">💰 ${fm(u.price)}</div>
      <button class="buyBtn" onclick="startBuy('${k}',2)" ${currentPlayer!==2?'disabled':''}>Купити</button></div>`;
  });
  leftPanel.innerHTML=html1; rightPanel.innerHTML=html2;
}

window.startBuy = function(type,player){ if(player!==playerId)return; buyMode=type; }
function cellClick(x,y){ if(currentPlayer!==playerId) return; /* тут можна додати рух/атаки/покупку */ }
window.endTurn=function(){ currentPlayer=3-currentPlayer; turn++; state.units.forEach(u=>{ if(u.owner===currentPlayer){ u.movePoints=unitTypes[u.type].speed; u.attacked=false; }}); saveState(); render(); }

// ================= JOIN =================
document.getElementById('joinBtn').onclick=()=>{
  room=document.getElementById('roomInput').value.trim(); 
  playerId=parseInt(document.getElementById('playerSelect').value); 
  loadState(room);
};

render();
</script>
</body>
</html>
