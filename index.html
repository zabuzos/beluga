<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beluga Multiplayer</title>
<style>
body { font-family: Arial; background:#f0f0f0; margin:0; display:flex; flex-direction:column; align-items:center; }
#lobby, #gameArea { width:100%; max-width:1200px; margin-top:20px; }
.hidden { display:none; }

#grid { display:grid; grid-template-columns: repeat(18, 60px); grid-gap:2px; justify-content:center; }
.cell { width:60px; height:60px; border:1px solid #ccc; position:relative; }
.city { background:gold; }
.unitImg { width:100%; height:100%; object-fit:contain; border-radius:6px; }
.unitP1 { outline:3px solid #2196F3; }
.unitP2 { outline:3px solid #f44336; }
.hp { position:absolute; bottom:2px; right:2px; font-size:12px; color:white; background:rgba(0,0,0,0.6); padding:2px; }
.mp { position:absolute; top:2px; left:2px; font-size:11px; background:white; padding:1px 3px; border-radius:4px; }

.panel { width:220px; display:inline-block; vertical-align:top; }
.card { background:white; padding:10px; margin-bottom:12px; border-radius:10px; text-align:center; }
.shopImg { width:100%; height:110px; object-fit:contain; margin:6px 0; }
.buyBtn { background: linear-gradient(180deg, #4CAF50, #2e7d32); border: none; border-radius: 8px; padding: 8px; color: white; font-weight: bold; cursor: pointer; width:100%; }
.buyBtn:hover { transform: scale(1.05); } 
.buyBtn:active { transform: scale(0.95); }

#controls { margin-top:10px; }
</style>
</head>
<body>

<div id="lobby">
  <h2>Beluga Multiplayer</h2>
  <label>Назва кімнати: <input type="text" id="roomInput" placeholder="Room1"></label><br><br>
  <label>Вибір гравця: 
    <select id="playerSelect">
      <option value="1">P1</option>
      <option value="2">P2</option>
    </select>
  </label><br><br>
  <button id="joinBtn" class="buyBtn">Приєднатись</button>
</div>

<div id="gameArea" class="hidden">
  <div style="text-align:center">
    Хід: <span id="turn"></span> | Гравець: <span id="player"></span><br>
    💰 P1: <span id="money1"></span> | P2: <span id="money2"></span>
  </div>

  <div style="display:flex; justify-content:center; margin-top:10px;">
    <div class="panel" id="leftPanel"></div>
    <div>
      <div id="grid"></div>
      <div id="controls">
        <button class="buyBtn" onclick="endTurn()">Закінчити хід</button>
        <button class="buyBtn" onclick="newGame()">Нова гра</button>
      </div>
    </div>
    <div class="panel" id="rightPanel"></div>
  </div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

// --- Firebase config ---
const firebaseConfig = {
  apiKey: "AIzaSyBM6L4pO6cCkCX6mhChNG0-5RxKYOIV1fY",
  authDomain: "beluga-a7197.firebaseapp.com",
  databaseURL: "https://beluga-a7197-default-rtdb.firebaseio.com",
  projectId: "beluga-a7197",
  storageBucket: "beluga-a7197.appspot.com",
  messagingSenderId: "1019986290981",
  appId: "1:1019986290981:web:1a0685a543fa63e5a152cc",
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// --- Лобі ---
let room, playerNum;

// --- GRID ---
const width = 18, height = 10;
let state = null;
let selectedUnit = null;
let buyMode = null;

// --- Units ---
const unitTypes = {
  shooter: {name:"Стрілець", speed:1, atk:15, hp:50, range:3, price:50000, img1:"img/shooter_p1.png", img2:"img/shooter_p2.png"},
  infantry:{name:"Піхота", speed:3, atk:20, hp:50, range:1, price:40000, img1:"img/infantry_p1.png", img2:"img/infantry_p2.png"},
  cavalry:{name:"Кавалерія", speed:4, atk:20, hp:55, range:1, price:120000, img1:"img/cavalry_p1.png", img2:"img/cavalry_p2.png"}
};

// --- Lobby join ---
document.getElementById('joinBtn').onclick = ()=>{
  room = document.getElementById('roomInput').value.trim();
  playerNum = parseInt(document.getElementById('playerSelect').value);

  if(!room) { alert("Введіть назву кімнати"); return; }

  // Якщо нова гра, ініціалізація
  const roomRef = ref(db, 'rooms/'+room);
  set(roomRef, {
    turn:1,
    currentPlayer:1,
    money:{1:500000,2:500000},
    units:[],
    cities:[{x:1,y:4},{x:1,y:5},{x:16,y:4},{x:16,y:5}]
  });

  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('gameArea').classList.remove('hidden');

  // Слухаємо зміни в Firebase
  onValue(roomRef, snapshot=>{
    state = snapshot.val();
    render();
  });
};

// --- Grid ---
function createGrid(){
  const g=document.getElementById('grid');
  g.innerHTML='';
  for(let y=0;y<height;y++){
    for(let x=0;x<width;x++){
      const d=document.createElement('div');
      d.className='cell';
      d.dataset.x=x; d.dataset.y=y;
      d.onclick=()=>cellClick(x,y);
      g.appendChild(d);
    }
  }
}

// --- Rendering ---
function fm(n){ return Math.round(n/1000)+'к'; }

function render(){
  if(!state) return;
  document.getElementById('turn').innerText = state.turn;
  document.getElementById('player').innerText = state.currentPlayer;
  document.getElementById('money1').innerText = fm(state.money[1]);
  document.getElementById('money2').innerText = fm(state.money[2]);

  document.querySelectorAll('.cell').forEach(c=>{
    c.innerHTML=''; c.classList.remove('city');
  });

  // Cities with icons
  state.cities.forEach(c=>{
    const cell = getCell(c.x,c.y);
    cell.classList.add('city');
    const img=document.createElement('img');
    img.src="img/castle.png"; // вставляємо іконку фортеці
    img.style.width="100%"; img.style.height="100%"; img.style.objectFit="contain";
    cell.appendChild(img);
  });

  // Units
  state.units.forEach(u=>{
    const cell = getCell(u.x,u.y);
    const img = document.createElement('img');
    img.src = u.owner===1 ? unitTypes[u.type].img1 : unitTypes[u.type].img2;
    img.className='unitImg '+(u.owner===1?'unitP1':'unitP2');
    cell.appendChild(img);

    const hp = document.createElement('div'); hp.className='hp'; hp.innerText=u.hp; cell.appendChild(hp);
    const mp = document.createElement('div'); mp.className='mp'; mp.innerText=u.movePoints; cell.appendChild(mp);
  });

  renderPanels();
}

function renderPanels(){
  let html=''; 
  Object.keys(unitTypes).forEach(k=>{
    const u=unitTypes[k];
    html+=`<div class="card shopCard">
      <div>${u.name}</div>
      <img src="${playerNum===1?u.img1:u.img2}" class="shopImg">
      <div>🏃 ${u.speed} ⚔️ ${u.atk} ❤️ ${u.hp} 🎯 ${u.range}</div>
      <div>💰 ${fm(u.price)}</div>
      <button class="buyBtn" onclick="startBuy('${k}')">Купити</button>
    </div>`;
  });
  document.getElementById('leftPanel').innerHTML=html;
  document.getElementById('rightPanel').innerHTML=html;
}

// --- Buy ---
function startBuy(type){ buyMode=type; }
function getCell(x,y){ return document.querySelector(`.cell[data-x='${x}'][data-y='${y}']`); }
function isOwnSide(x){ return playerNum===1 ? x<9 : x>=9; }

// --- Click ---
function cellClick(x,y){
  if(!state) return;
  let unit = state.units.find(u=>u.x===x && u.y===y);

  if(buyMode){
    if(unit || !isOwnSide(x)) return;
    const utype = unitTypes[buyMode];
    if(state.money[playerNum]<utype.price) return;

    state.money[playerNum]-=utype.price;
    state.units.push({x,y,type:buyMode,owner:playerNum,hp:utype.hp,movePoints:utype.speed,attacked:false});
    buyMode=null;
    update(ref(db,'rooms/'+room), state);
    return;
  }
}

// --- Turn ---
function endTurn(){
  if(!state) return;
  state.currentPlayer = state.currentPlayer===1 ? 2 :1;
  if(state.currentPlayer===1) state.turn+=1;

  state.money[state.currentPlayer]+=100000;
  state.units.forEach(u=>{
    if(u.owner===state.currentPlayer){
      u.movePoints = unitTypes[u.type].speed;
      u.attacked=false;
    }
  });

  update(ref(db,'rooms/'+room), state);
}

// --- New Game ---
function newGame(){
  if(!room) return;
  set(ref(db,'rooms/'+room), {
    turn:1,
    currentPlayer:1,
    money:{1:500000,2:500000},
    units:[],
    cities:[{x:1,y:4},{x:1,y:5},{x:16,y:4},{x:16,y:5}]
  });
}

createGrid();
</script>
</body>
</html>
