<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beluga 3 Multiplayer v2</title>

<style>
body {font-family: Arial;background:#f0f0f0;display:flex;justify-content:center;gap:20px;flex-wrap: wrap;}
#grid {display:grid;grid-template-columns: repeat(18, 60px);} 
.cell {width:60px;height:60px;border:1px solid rgba(0,0,0,0.1);position:relative;background-image:url('img/ground.png');background-size:cover;background-repeat:repeat;opacity:0.9;}
.panel { width: 220px; }
@media (max-width: 768px) {
  .panel { width: 95%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  #gridWrapper { transform: scale(1); width: 100vw; overflow:auto; }
  #grid { grid-template-columns: repeat(18, 40px); }
  .cell { width: 40px; height: 40px; }
  body { flex-direction: column; align-items: center; }
}
#logo { max-width:230px; height:auto; margin-bottom:10px; display:block; margin-left:auto; margin-right:auto; }
.tabContent { width:100%; max-width:1200px; }
.tabBtn { padding:6px 12px; font-weight:bold; border-radius:6px; border:1px solid #333; cursor:pointer; background:#eee; }
.tabBtn:hover { background:#ddd; }
.tabBtn.active { background:#2196F3; color:white; }
.buyBtn {margin-top:5px; padding:6px 12px; font-weight:bold; border-radius:6px; border:none; background:#4CAF50; color:white; cursor:pointer;}
.buyBtn:hover{background:#45a049;}
</style>
</head>
<body>

<div><img src="img/logo.png" id="logo"></div>

<div id="menu">
  <input type="text" id="roomInput" placeholder="Назва кімнати" />
  <select id="playerSelect">
    <option value="1">Гравець 1</option>
    <option value="2">Гравець 2</option>
  </select>
  <select id="unitSetSelect">
    <option value="default">Стандартний комплект</option>
  </select>
  <button id="joinBtn">Приєднатися</button>
</div>

<div class="panel" id="leftPanel"></div>

<div>
  <div id="turnPanel">
    <h3>
      Хід: <span id="turn"></span> |
      Гравець: <span id="player"></span><br>
      💰 P1: <span id="money1"></span> |
      P2: <span id="money2"></span>
    </h3>
  </div>

  <div id="gridWrapper">
    <div id="grid"></div>
  </div>

  <button class="buyBtn" id="endTurnBtn">Закінчити хід</button>
  <button class="buyBtn" id="resetBtn">Нова гра</button>

  <!-- Вкладки -->
  <div style="margin-top:10px; display:flex; flex-direction:column; align-items:center; gap:10px; width:100%;">
    <div style="display:flex; gap:10px;">
      <button class="tabBtn active" data-tab="gameTab">Гра</button>
      <button class="tabBtn" data-tab="unitsTab">Юніти</button>
    </div>

    <div id="gameTab" class="tabContent">
      <p style="text-align:center;margin-top:10px;">Поле гри та магазини юнітів</p>
    </div>

    <div id="unitsTab" class="tabContent" style="display:none;">
      <h3>Створення комплектів юнітів</h3>
      <input type="text" id="newSetName" placeholder="Назва комплекту" />
      <button id="createSetBtn">Створити комплект</button>
      <div id="unitSetEditor" style="margin-top:10px;"></div>
    </div>
  </div>
</div>

<div class="panel" id="rightPanel"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBM6L4pO6cCkCX6mhChNG0-5RxKYOIV1fY",
  authDomain: "beluga-a7197.firebaseapp.com",
  databaseURL: "https://beluga-a7197-default-rtdb.firebaseio.com",
  projectId: "beluga-a7197",
  storageBucket: "beluga-a7197.appspot.com",
  messagingSenderId: "1019986290981",
  appId: "1:1019986290981:web:1a0685a543fa63e5a152cc"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let currentPlayer=1, playerId=1, turn=1, selectedUnit=null, buyMode=null;
let state={units:[], money:{1:500000,2:500000}, cities:[{x:1,y:4},{x:1,y:5},{x:16,y:4},{x:16,y:5}]};
let unitTypes={
  shooter:{name:"Стрілець", speed:1, atk:15, hp:50, range:3, price:50000,img1:"img/shooter_p1.png",img2:"img/shooter_p2.png"},
  infantry:{name:"Піхота", speed:3, atk:20, hp:50, range:1, price:40000,img1:"img/infantry_p1.png",img2:"img/infantry_p2.png"},
  cavalry:{name:"Кавалерія", speed:4, atk:20, hp:55, range:1, price:120000,img1:"img/cavalry_p1.png",img2:"img/cavalry_p2.png"}
};
let unitSets={ default: Object.keys(unitTypes) };

function fm(n){ return (n/1000)+'к'; }
function createGrid(){
  let g=document.getElementById('grid'); g.innerHTML='';
  for(let y=0;y<10;y++){
    for(let x=0;x<18;x++){
      let d=document.createElement('div');
      d.className='cell';
      d.dataset.x=x; d.dataset.y=y;
      g.appendChild(d);
    }
  }
}

function render(){
  document.getElementById('turn').innerText=turn;
  document.getElementById('player').innerText=currentPlayer;
  document.getElementById('money1').innerText=fm(state.money[1]);
  document.getElementById('money2').innerText=fm(state.money[2]);
}

function showTab(tabId){
  document.querySelectorAll('.tabContent').forEach(t=>t.style.display='none');
  document.getElementById(tabId).style.display='block';
  document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`.tabBtn[data-tab='${tabId}']`).classList.add('active');
}

function resetState(){
  state={units:[], money:{1:500000,2:500000}, cities:[{x:1,y:4},{x:1,y:5},{x:16,y:4},{x:16,y:5}]};
  turn=1; currentPlayer=1; render();
}

function createNewSet(){
  const name=document.getElementById('newSetName').value.trim();
  if(!name){ alert("Введіть назву комплекту"); return; }
  if(unitSets[name]){ alert("Такий комплект вже існує"); return; }
  unitSets[name]=[];
  document.getElementById('unitSetSelect').appendChild(new Option(name,name));
  renderUnitSetEditor(name);
}

function renderUnitSetEditor(setName){
  const container=document.getElementById('unitSetEditor');
  container.innerHTML=`<h4>Редагування комплекту: ${setName}</h4>`;
}

window.showTab = showTab;
window.resetState = resetState;
window.createNewSet = createNewSet;

document.getElementById('resetBtn').onclick=resetState;
document.getElementById('createSetBtn').onclick=createNewSet;

createGrid();
render();
</script>
</body>
</html>
