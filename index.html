<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Beluga Battle - Original Units & Editor</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; margin: 0; padding: 20px; }
        .nav { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: none; background: #95a5a6; border-radius: 5px; font-weight: bold; }
        .tab-btn.active { background: #3498db; color: white; }
        .tab-content { display: none; }
        
        /* ГРАФІКА ПОЛЯ */
        #gridWrapper { 
            overflow: auto; border: 4px solid #000; border-radius: 10px; 
            background-image: url('https://raw.githubusercontent.com/zabuzos/beluga/main/img/ground.png');
            background-size: 60px 60px; /* Розмір під клітинку */
            width: fit-content; margin: 0 auto;
        }
        #grid { display: grid; grid-template-columns: repeat(18, 60px); background: rgba(0,0,0,0.2); }
        .cell { width: 60px; height: 60px; border: 1px solid rgba(255,255,255,0.1); position: relative; cursor: pointer; }
        .divider { border-right: 3px dashed gold !important; }
        
        /* МЕНЮ ТА ПАНЕЛІ */
        #menu { background: #34495e; padding: 30px; border-radius: 15px; text-align: center; max-width: 400px; margin: 50px auto; }
        .menu-row { margin-bottom: 15px; }
        input, select { padding: 10px; border-radius: 5px; border: none; width: 100%; box-sizing: border-box; }
        
        .panel { width: 220px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; }
        .card { background: #ecf0f1; color: #333; padding: 10px; margin-bottom: 10px; border-radius: 8px; text-align: center; }
        .shopImg { width: 100%; height: 60px; object-fit: contain; }
        
        .unitImg { width: 80%; height: 80%; object-fit: contain; margin: 10%; pointer-events: none; }
        .unitP1 { filter: drop-shadow(0 0 5px #3498db); }
        .unitP2 { filter: drop-shadow(0 0 5px #e74c3c); }
        .hp { position: absolute; bottom: 2px; right: 2px; font-size: 11px; background: red; color: white; padding: 1px 4px; border-radius: 3px; }

        .btn { background: #27ae60; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn:hover { background: #2ecc71; }
        
        /* РЕДАКТОР АРМІЇ */
        .editor-container { max-width: 800px; margin: 0 auto; background: #34495e; padding: 20px; border-radius: 10px; }
        .unit-edit-card { background: #2c3e50; padding: 15px; margin-bottom: 15px; border-radius: 8px; border-left: 5px solid #3498db; }
        .edit-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }
        .city { background: rgba(241, 196, 15, 0.3) !important; border: 2px solid #f1c40f !important; box-sizing: border-box; }
        .selected { outline: 3px solid white; box-shadow: 0 0 15px white; }
    </style>
</head>
<body>

<div class="nav">
    <button class="tab-btn active" onclick="openTab(event, 'game-tab')">ГРАТИ</button>
    <button class="tab-btn" onclick="openTab(event, 'army-tab')">АРМІЯ</button>
</div>

<div id="game-tab" class="tab-content" style="display: block;">
    <div id="menu">
        <h2>⚔️ BELUGA BATTLE</h2>
        <div class="menu-row"><input type="text" id="roomInput" placeholder="Код кімнати"></div>
        <div class="menu-row">
            <select id="playerSelect">
                <option value="1">Гравець 1 (Сині)</option>
                <option value="2">Гравець 2 (Червоні)</option>
            </select>
        </div>
        <div class="menu-row">
            <select id="teamSelect"></select>
        </div>
        <button class="btn" id="joinBtn">УВІЙТИ В БИТВУ</button>
    </div>

    <div id="gameArea" style="display: none;">
        <div style="display: flex; justify-content: center; gap: 20px;">
            <div class="panel" id="leftPanel"></div>
            <div>
                <div style="background: #34495e; padding: 10px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between;">
                    <span>Хід: <b id="turn">1</b> | Гравець: <b id="playerDisplay">1</b></span>
                    <span>💰 <b id="myMoney">0</b>к</span>
                    <button onclick="window.endTurn()" style="background: #e67e22; border: none; color: white; padding: 5px 15px; border-radius: 4px; cursor: pointer;">Завершити хід</button>
                </div>
                <div id="gridWrapper"><div id="grid"></div></div>
            </div>
            <div class="panel" id="rightPanel"></div>
        </div>
    </div>
</div>

<div id="army-tab" class="tab-content">
    <div class="editor-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>🛠️ Редактор Армії</h2>
            <button class="btn" style="width: auto;" onclick="addNewArmy()">+ Створити нову команду</button>
        </div>
        <div id="armyList"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBM6L4pO6cCkCX6mhChNG0-5RxKYOIV1fY",
    databaseURL: "https://beluga-a7197-default-rtdb.firebaseio.com",
    projectId: "beluga-a7197"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ТВОЯ ПОЧАТКОВА КОМАНДА З 6 ЮНІТІВ (по 3 на сторону)
const INITIAL_ARMY = {
    name: "Стандартна (GitHub)",
    units: {
        u1: { name: "Піхота", speed: 3, atk: 20, hp: 50, range: 1, price: 40000, img1: "https://raw.githubusercontent.com/zabuzos/beluga/main/img/infantry_p1.png", img2: "https://raw.githubusercontent.com/zabuzos/beluga/main/img/infantry_p2.png" },
        u2: { name: "Лучник", speed: 2, atk: 15, hp: 40, range: 3, price: 60000, img1: "https://raw.githubusercontent.com/zabuzos/beluga/main/img/shooter_p1.png", img2: "https://raw.githubusercontent.com/zabuzos/beluga/main/img/shooter_p2.png" },
        u3: { name: "Лицар", speed: 5, atk: 25, hp: 70, range: 1, price: 120000, img1: "https://raw.githubusercontent.com/zabuzos/beluga/main/img/cavalry_p1.png", img2: "https://raw.githubusercontent.com/zabuzos/beluga/main/img/cavalry_p2.png" }
    }
};

let userArmies = JSON.parse(localStorage.getItem('beluga_user_armies')) || [INITIAL_ARMY];
let state = { units: [], money: {1: 500000, 2: 500000}, playerConfigs: {} };
let room = "", playerId = 1, currentPlayer = 1, turn = 1, selectedUnit = null, buyMode = null;

// НАВІГАЦІЯ
window.openTab = (e, id) => {
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).style.display = 'block';
    e.currentTarget.classList.add('active');
    if(id === 'army-tab') renderArmyEditor();
};

// РЕДАКТОР АРМІЙ
window.addNewArmy = () => {
    const name = prompt("Назва команди:");
    if(name) {
        userArmies.push({ name, units: {} });
        saveAndRefresh();
    }
};

window.addUnitToArmy = (armyIdx) => {
    const id = 'u' + Date.now();
    userArmies[armyIdx].units[id] = { name: "Новий юніт", speed: 3, atk: 10, hp: 100, range: 1, price: 50000, img1: "", img2: "" };
    saveAndRefresh();
};

window.updateUnitField = (armyIdx, uId, field, val) => {
    userArmies[armyIdx].units[uId][field] = (field === 'name' || field.includes('img')) ? val : parseInt(val);
    localStorage.setItem('beluga_user_armies', JSON.stringify(userArmies));
};

function saveAndRefresh() {
    localStorage.setItem('beluga_user_armies', JSON.stringify(userArmies));
    renderArmyEditor();
    updateTeamList();
}

function renderArmyEditor() {
    const container = document.getElementById('armyList');
    container.innerHTML = userArmies.map((army, aIdx) => `
        <div class="editor-set">
            <h3>📦 Команда: ${army.name} <button onclick="deleteArmy(${aIdx})" style="color:red; background:none; border:none; cursor:pointer;">(Видалити)</button></h3>
            ${Object.keys(army.units).map(uId => `
                <div class="unit-edit-card">
                    <input type="text" value="${army.units[uId].name}" onchange="updateUnitField(${aIdx}, '${uId}', 'name', this.value)" style="font-weight:bold; margin-bottom:10px;">
                    <div class="edit-grid">
                        <input type="number" placeholder="Ціна" value="${army.units[uId].price}" onchange="updateUnitField(${aIdx}, '${uId}', 'price', this.value)">
                        <input type="number" placeholder="HP" value="${army.units[uId].hp}" onchange="updateUnitField(${aIdx}, '${uId}', 'hp', this.value)">
                        <input type="number" placeholder="ATK" value="${army.units[uId].atk}" onchange="updateUnitField(${aIdx}, '${uId}', 'atk', this.value)">
                        <input type="number" placeholder="Speed" value="${army.units[uId].speed}" onchange="updateUnitField(${aIdx}, '${uId}', 'speed', this.value)">
                        <input type="number" placeholder="Range" value="${army.units[uId].range}" onchange="updateUnitField(${aIdx}, '${uId}', 'range', this.value)">
                    </div>
                    <div class="edit-grid" style="grid-template-columns: 1fr 1fr; margin-top:10px;">
                        <input type="text" placeholder="URL картинки P1" value="${army.units[uId].img1}" onchange="updateUnitField(${aIdx}, '${uId}', 'img1', this.value)">
                        <input type="text" placeholder="URL картинки P2" value="${army.units[uId].img2}" onchange="updateUnitField(${aIdx}, '${uId}', 'img2', this.value)">
                    </div>
                </div>
            `).join('')}
            <button class="btn" onclick="addUnitToArmy(${aIdx})">+ Додати юніта</button>
        </div>
    `).join('<hr>');
}

window.deleteArmy = (idx) => { if(confirm("Видалити армію?")) { userArmies.splice(idx,1); saveAndRefresh(); } };

// ЛОГІКА ГРИ
function updateTeamList() {
    const sel = document.getElementById('teamSelect');
    sel.innerHTML = userArmies.map((a, i) => `<option value="${i}">${a.name}</option>`).join('');
}

document.getElementById('joinBtn').onclick = async () => {
    room = document.getElementById('roomInput').value.trim();
    playerId = parseInt(document.getElementById('playerSelect').value);
    const armyIdx = document.getElementById('teamSelect').value;
    const selectedArmy = userArmies[armyIdx];

    if(!room) return alert("Введіть код кімнати");

    const snap = await get(ref(db, 'games/'+room));
    if(!snap.exists()) {
        state = { units: [], money: {1:500000, 2:500000}, cities: [{x:1,y:4},{x:1,y:5},{x:16,y:4},{x:16,y:5}], playerConfigs: {} };
    } else {
        state = snap.val().state;
        turn = snap.val().turn;
        currentPlayer = snap.val().currentPlayer;
    }
    
    if(!state.playerConfigs) state.playerConfigs = {};
    state.playerConfigs[playerId] = selectedArmy;
    
    await set(ref(db, 'games/'+room), { state, turn, currentPlayer });
    
    document.getElementById('menu').style.display = 'none';
    document.getElementById('gameArea').style.display = 'block';
    createGrid();
    
    onValue(ref(db, 'games/'+room), (s) => {
        const d = s.val(); if(!d) return;
        state = d.state; turn = d.turn; currentPlayer = d.currentPlayer;
        render();
    });
};

function createGrid() {
    const g = document.getElementById('grid'); g.innerHTML = '';
    for(let y=0; y<10; y++) {
        for(let x=0; x<18; x++) {
            const d = document.createElement('div');
            d.className = 'cell';
            if(x === 8) d.classList.add('divider');
            d.id = `c-${x}-${y}`;
            d.onclick = () => cellClick(x, y);
            g.appendChild(d);
        }
    }
}

function cellClick(x, y) {
    if(currentPlayer !== playerId) return;
    const unit = (state.units || []).find(u => u.x === x && u.y === y);
    const myConfig = state.playerConfigs[playerId]?.units || {};

    if(buyMode) {
        const uInfo = myConfig[buyMode];
        const isMySide = (playerId === 1) ? x < 9 : x >= 9;
        if(!unit && isMySide && state.money[playerId] >= uInfo.price) {
            state.money[playerId] -= uInfo.price;
            if(!state.units) state.units = [];
            state.units.push({ x, y, owner: playerId, type: buyMode, hp: uInfo.hp, movePoints: 0, attacked: true });
            buyMode = null; save();
        }
        return;
    }

    if(unit && unit.owner === playerId) { selectedUnit = unit; render(); return; }
    
    if(selectedUnit && !unit) {
        const dist = Math.max(Math.abs(selectedUnit.x - x), Math.abs(selectedUnit.y - y));
        if(dist <= selectedUnit.movePoints) {
            selectedUnit.x = x; selectedUnit.y = y;
            selectedUnit.movePoints -= dist;
            save();
        }
    }
}

window.endTurn = () => {
    if(currentPlayer !== playerId) return;
    currentPlayer = (currentPlayer === 1) ? 2 : 1;
    if(currentPlayer === 1) turn++;
    state.money[currentPlayer] += 100000;
    (state.units || []).forEach(u => {
        if(u.owner === currentPlayer) {
            const cfg = state.playerConfigs[u.owner].units[u.type];
            u.movePoints = cfg ? cfg.speed : 1;
            u.attacked = false;
        }
    });
    save();
};

function save() { set(ref(db, 'games/'+room), { state, turn, currentPlayer }); }

function render() {
    document.getElementById('turn').innerText = turn;
    document.getElementById('playerDisplay').innerText = currentPlayer;
    document.getElementById('myMoney').innerText = Math.floor(state.money[playerId]/1000);
    
    document.querySelectorAll('.cell').forEach(c => {
        c.innerHTML = ''; c.classList.remove('selected','city');
    });

    (state.cities || []).forEach(c => document.getElementById(`c-${c.x}-${c.y}`)?.classList.add('city'));

    (state.units || []).forEach(u => {
        const cell = document.getElementById(`c-${u.x}-${u.y}`);
        const config = state.playerConfigs[u.owner]?.units[u.type];
        if(!cell || !config) return;

        const img = document.createElement('img');
        img.src = u.owner === 1 ? config.img1 : config.img2;
        img.className = 'unitImg ' + (u.owner === 1 ? 'unitP1' : 'unitP2');
        cell.appendChild(img);
        
        const hp = document.createElement('div'); hp.className = 'hp'; hp.innerText = u.hp; cell.appendChild(hp);
        if(u === selectedUnit) cell.classList.add('selected');
    });

    renderShop();
}

function renderShop() {
    const draw = (p) => {
        const target = p === 1 ? 'leftPanel' : 'rightPanel';
        const config = state.playerConfigs[p];
        if(!config) { 
            document.getElementById(target).innerHTML = `<p style="font-size:12px; opacity:0.7;">Очікування Гравця ${p}...</p>`; 
            return; 
        }
        
        let html = `<h3 style="margin:5px 0;">P${p}: ${config.name}</h3>`;
        
        Object.keys(config.units).forEach(k => {
            const u = config.units[k];
            html += `
                <div class="card">
                    <div style="font-size: 14px; font-weight: bold; margin-bottom: 5px;">${u.name}</div>
                    <img src="${p===1 ? u.img1 : u.img2}" class="shopImg">
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; font-size: 11px; margin: 5px 0; background: #dfe6e9; border-radius: 4px; padding: 3px;">
                        <span>❤️ ${u.hp}</span>
                        <span>⚔️ ${u.atk}</span>
                        <span>👟 ${u.speed}</span>
                        <span>🎯 ${u.range}</span>
                    </div>
                    
                    <button class="btn" onclick="window.setBuy('${k}')" ${playerId !== p || currentPlayer !== p ? 'disabled' : ''}>
                        🛒 ${u.price/1000}k
                    </button>
                </div>`;
        });
        document.getElementById(target).innerHTML = html;
    };
    draw(1); 
    draw(2);
}

window.setBuy = (k) => { buyMode = k; };

updateTeamList();
</script>
</body>
</html>
