<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beluga Battle - Victory Conditions</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; margin: 0; padding: 15px; }
        .nav { display: flex; gap: 15px; margin-bottom: 25px; justify-content: center; }
        .tab-btn { padding: 12px 25px; cursor: pointer; border: none; background: #95a5a6; border-radius: 8px; font-weight: bold; font-size: 16px; }
        .tab-btn.active { background: #3498db; color: white; }
        .tab-content { display: none; }
        
        #gridWrapper { 
            overflow: auto; border: 5px solid #000; border-radius: 12px; 
            background-image: url('https://raw.githubusercontent.com/zabuzos/beluga/main/img/ground.png');
            background-size: 60px 60px; width: fit-content; margin: 0 auto; max-width: 100%;
        }
        #grid { display: grid; grid-template-columns: repeat(18, 60px); background: rgba(0,0,0,0.2); }
        .cell { width: 60px; height: 60px; border: 1px solid rgba(255,255,255,0.1); position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 35px; }
        .divider { border-right: 4px dashed gold !important; }
        
        .panel { width: 280px; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; }
        .card { background: #ecf0f1; color: #333; padding: 12px; margin-bottom: 15px; border-radius: 10px; text-align: center; }
        .shopImg { width: 100%; height: 70px; object-fit: contain; }
        
        .unitImg { width: 85%; height: 85%; object-fit: contain; position: absolute; pointer-events: none; z-index: 2; }
        .unitP1 { filter: drop-shadow(0 0 8px #3498db); }
        .unitP2 { filter: drop-shadow(0 0 8px #e74c3c); }
        .hp { position: absolute; bottom: 4px; right: 4px; font-size: 12px; background: red; color: white; padding: 2px 5px; border-radius: 4px; z-index: 3; font-weight: bold; }

        .btn { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .city { background: rgba(241, 196, 15, 0.4) !important; border: 2px solid gold !important; }
        .selected { outline: 4px solid white; box-shadow: 0 0 20px white; z-index: 5; }
        .container { display: flex; justify-content: center; gap: 25px; }
    </style>
</head>
<body>

<div class="nav">
    <button class="tab-btn active" onclick="openTab(event, 'game-tab')">ГРАТИ</button>
    <button class="tab-btn" onclick="openTab(event, 'army-tab')">АРМІЯ</button>
</div>

<div id="game-tab" class="tab-content" style="display: block;">
    <div id="menu" style="background: #34495e; padding: 30px; border-radius: 20px; text-align: center; max-width: 450px; margin: 40px auto;">
        <h1 style="color: #f1c40f;">⚔️ BELUGA BATTLE</h1>
        <input type="text" id="roomInput" placeholder="Код кімнати" style="padding:12px; border-radius:6px; margin-bottom:15px; width:100%;">
        <select id="playerSelect" style="padding:12px; border-radius:6px; margin-bottom:15px; width:100%;">
            <option value="1">Гравець 1 (Ліві)</option>
            <option value="2">Гравець 2 (Праві)</option>
        </select>
        <select id="teamSelect" style="padding:12px; border-radius:6px; margin-bottom:20px; width:100%;"></select>
        <button class="btn" id="joinBtn" style="font-size: 18px; padding: 15px;">УВІЙТИ В БИТВУ</button>
    </div>

    <div id="gameArea" style="display: none;">
        <div class="container">
            <div class="panel" id="leftPanel"></div>
            <div class="main-game-block">
                <div id="turnPanel" style="background: #34495e; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                    <span>Хід: <b id="turn">1</b> | P<b id="playerDisplay">1</b></span>
                    <span>💰 <b id="myMoney">0</b>к</span>
                    <button onclick="window.endTurn()" style="background: #e67e22; border: none; color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer;">OK</button>
                </div>
                <div id="gridWrapper"><div id="grid"></div></div>
            </div>
            <div class="panel" id="rightPanel"></div>
        </div>
    </div>
</div>

<div id="army-tab" class="tab-content">
    <div class="editor-container" style="max-width: 900px; margin: 0 auto; background: #34495e; padding: 25px; border-radius: 15px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <h2 style="margin:0;">🛠️ Редактор Рас</h2>
            <button class="btn" style="width: auto; padding: 10px 20px;" onclick="addNewArmy()">+ Створити нову расу</button>
        </div>
        <div id="armyList"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBM6L4pO6cCkCX6mhChNG0-5RxKYOIV1fY",
    databaseURL: "https://beluga-a7197-default-rtdb.firebaseio.com",
    projectId: "beluga-a7197"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let userArmies = JSON.parse(localStorage.getItem('beluga_user_armies')) || [{name:"Люди", units:{}}];
let state = { units: [], money: {1: 500000, 2: 500000}, cities: [], playerConfigs: {} };
let room = "", playerId = 1, currentPlayer = 1, turn = 1, selectedUnit = null, buyMode = null;

// НАВІГАЦІЯ ТА РЕДАКТОР (Спрощено для читання)
window.openTab = (e, id) => {
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).style.display = 'block';
    e.currentTarget.classList.add('active');
    if(id === 'army-tab') renderArmyEditor();
};

window.addNewArmy = () => {
    const name = prompt("Назва раси:");
    if(name) { userArmies.push({ name, units: {} }); saveAndRefresh(); }
};

window.updateArmyName = (idx, val) => { userArmies[idx].name = val; saveAndRefresh(); };

window.addUnitToArmy = (idx) => {
    const id = 'u' + Date.now();
    userArmies[idx].units[id] = { name: "Воїн", speed: 3, atk: 10, hp: 100, range: 1, price: 50000, img: "" };
    saveAndRefresh();
};

window.deleteUnit = (aIdx, uId) => { delete userArmies[aIdx].units[uId]; saveAndRefresh(); };

window.updateUnitField = (aIdx, uId, field, val) => {
    userArmies[aIdx].units[uId][field] = (field === 'name' || field === 'img') ? val : parseInt(val);
    localStorage.setItem('beluga_user_armies', JSON.stringify(userArmies));
};

function saveAndRefresh() {
    localStorage.setItem('beluga_user_armies', JSON.stringify(userArmies));
    renderArmyEditor();
    updateTeamList();
}

function renderArmyEditor() {
    const container = document.getElementById('armyList');
    container.innerHTML = userArmies.map((army, aIdx) => `
        <div class="editor-set" style="margin-bottom:30px; background: rgba(0,0,0,0.1); padding: 15px; border-radius:12px;">
            <input type="text" value="${army.name}" onchange="updateArmyName(${aIdx}, this.value)" style="background:none; color:#f1c40f; border:none; font-size:20px; font-weight:bold; margin-bottom:15px;">
            ${Object.keys(army.units).map(uId => `
                <div style="background:#2c3e50; padding:10px; margin-bottom:5px; border-radius:8px; position:relative;">
                    <button onclick="window.deleteUnit(${aIdx}, '${uId}')" style="position:absolute; right:5px; color:red; background:none; border:none; cursor:pointer;">🗑️</button>
                    <input type="text" value="${army.units[uId].name}" onchange="updateUnitField(${aIdx},'${uId}','name',this.value)" style="width:70%; margin-bottom:5px;">
                    <div style="display:flex; gap:5px; font-size:10px;">
                        Price <input type="number" value="${army.units[uId].price}" onchange="updateUnitField(${aIdx},'${uId}','price',this.value)" style="width:50px;">
                        HP <input type="number" value="${army.units[uId].hp}" onchange="updateUnitField(${aIdx},'${uId}','hp',this.value)" style="width:40px;">
                        SPD <input type="number" value="${army.units[uId].speed}" onchange="updateUnitField(${aIdx},'${uId}','speed',this.value)" style="width:30px;">
                    </div>
                    <input type="text" placeholder="URL картинки" value="${army.units[uId].img || ''}" onchange="updateUnitField(${aIdx},'${uId}','img',this.value)" style="width:100%; margin-top:5px;">
                </div>
            `).join('')}
            <button class="btn" onclick="addUnitToArmy(${aIdx})">+ Юніт</button>
        </div>
    `).join('');
}

// ЛОГІКА ГРИ
document.getElementById('joinBtn').onclick = async () => {
    room = document.getElementById('roomInput').value.trim();
    playerId = parseInt(document.getElementById('playerSelect').value);
    const armyIdx = document.getElementById('teamSelect').value;
    if(!room || !userArmies[armyIdx]) return alert("Оберіть кімнату та расу");

    const snap = await get(ref(db, 'games/'+room));
    if(!snap.exists()) {
        state = { units: [], money: {1:500000, 2:500000}, cities: generateCities(), playerConfigs: {} };
    } else {
        const d = snap.val(); state = d.state; turn = d.turn; currentPlayer = d.currentPlayer;
    }
    state.playerConfigs[playerId] = userArmies[armyIdx];
    save();
    document.getElementById('menu').style.display = 'none';
    document.getElementById('gameArea').style.display = 'block';
    createGrid();
    onValue(ref(db, 'games/'+room), (s) => {
        const d = s.val(); if(d) { 
            state = d.state; turn = d.turn; currentPlayer = d.currentPlayer; 
            render(); 
            checkWin(); 
        }
    });
};

function generateCities() {
    // Фіксовані міста для перемоги (2 у P1, 2 у P2)
    return [{x:0, y:2}, {x:0, y:7}, {x:17, y:2}, {x:17, y:7}];
}

function checkWin() {
    const p1Cities = state.cities.filter(c => c.x === 0);
    const p2Cities = state.cities.filter(c => c.x === 17);
    
    // Перевірка чи юніти P2 стоять на обох містах P1
    const p2Wins = p1Cities.every(c => state.units.some(u => u.x === c.x && u.y === c.y && u.owner === 2));
    // Перевірка чи юніти P1 стоять на обох містах P2
    const p1Wins = p2Cities.every(c => state.units.some(u => u.x === c.x && u.y === c.y && u.owner === 1));

    if(p1Wins) alert("Гравець 1 ЗАХОПИВ МІСТА! ПЕРЕМОГА!");
    if(p2Wins) alert("Гравець 2 ЗАХОПИВ МІСТА! ПЕРЕМОГА!");
}

function createGrid() {
    const g = document.getElementById('grid'); g.innerHTML = '';
    for(let y=0; y<10; y++) {
        for(let x=0; x<18; x++) {
            const d = document.createElement('div'); d.className = 'cell';
            if(x === 8) d.classList.add('divider');
            d.id = `c-${x}-${y}`; d.onclick = () => cellClick(x, y);
            g.appendChild(d);
        }
    }
}

function cellClick(x, y) {
    if(currentPlayer !== playerId) return;
    const unitAtCell = (state.units || []).find(u => u.x === x && u.y === y);

    // КУПІВЛЯ
    if(buyMode) {
        const cfg = state.playerConfigs[playerId].units[buyMode];
        // Умова: Половина поля (P1: x < 9, P2: x > 8)
        const isMyHalf = (playerId === 1 && x < 9) || (playerId === 2 && x > 8);
        if(!unitAtCell && isMyHalf && state.money[playerId] >= cfg.price) {
            state.money[playerId] -= cfg.price;
            state.units.push({ x, y, owner: playerId, type: buyMode, hp: cfg.hp, movePoints: 0, attacked: true });
            buyMode = null; save();
        }
        return;
    }

    // ВИБІР ТА ХІД
    if(unitAtCell && unitAtCell.owner === playerId) { selectedUnit = unitAtCell; render(); return; }
    if(selectedUnit && !unitAtCell) {
        const dist = Math.max(Math.abs(selectedUnit.x - x), Math.abs(selectedUnit.y - y));
        if(dist <= selectedUnit.movePoints) {
            selectedUnit.x = x; selectedUnit.y = y; selectedUnit.movePoints -= dist; save();
        }
    }
}

window.endTurn = () => {
    if(currentPlayer !== playerId) return;
    currentPlayer = (currentPlayer === 1) ? 2 : 1;
    if(currentPlayer === 1) turn++;
    state.money[currentPlayer] += 100000;
    state.units.forEach(u => {
        if(u.owner === currentPlayer) {
            const cfg = state.playerConfigs[u.owner]?.units[u.type];
            u.movePoints = cfg ? cfg.speed : 1; u.attacked = false;
        }
    });
    save();
};

function save() { set(ref(db, 'games/'+room), { state, turn, currentPlayer }); }

function render() {
    document.getElementById('turn').innerText = turn;
    document.getElementById('playerDisplay').innerText = currentPlayer;
    document.getElementById('myMoney').innerText = Math.floor((state.money[playerId] || 0)/1000);
    
    document.querySelectorAll('.cell').forEach(c => { 
        c.innerHTML = ''; c.classList.remove('selected','city'); 
    });
    
    // Рендер міст
    state.cities.forEach(c => {
        const cell = document.getElementById(`c-${c.x}-${c.y}`);
        if(cell) { cell.classList.add('city'); cell.innerHTML = '🏰'; }
    });

    // Рендер юнітів
    state.units.forEach(u => {
        const cell = document.getElementById(`c-${u.x}-${u.y}`);
        const cfg = state.playerConfigs[u.owner]?.units[u.type];
        if(!cell || !cfg) return;

        const img = document.createElement('img');
        img.className = 'unitImg ' + (u.owner === 1 ? 'unitP1' : 'unitP2');
        img.src = cfg.img;
        img.onerror = () => { img.style.display='none'; cell.innerHTML += (u.owner === 1 ? '🟦' : '🟥'); };
        
        cell.appendChild(img);
        const hp = document.createElement('div'); hp.className = 'hp'; hp.innerText = u.hp; cell.appendChild(hp);
        if(u === selectedUnit) cell.classList.add('selected');
    });
    renderShop();
}

function renderShop() {
    [1,2].forEach(p => {
        const target = p === 1 ? 'leftPanel' : 'rightPanel';
        const config = state.playerConfigs[p];
        if(!config) return;
        let html = `<h3 style="text-align:center;">${p===1?'🟦':'🟥'} ${config.name}</h3>`;
        Object.keys(config.units).forEach(k =>
