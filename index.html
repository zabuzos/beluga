<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beluga 3 Multiplayer</title>

<style>
body {font-family: Arial;background:#f0f0f0;display:flex;justify-content:center;gap:20px;flex-wrap: wrap;}

#grid {display:grid;grid-template-columns: repeat(18, 60px);}

.cell{
  width:60px;height:60px;
  border:1px solid rgba(0,0,0,0.1);
  position:relative;
  background-image:url('img/ground.png');
  background-size:cover;
}

.divider{border-right:4px dashed black;}

.panel{width:220px;}

.move{background:rgba(0,255,0,0.3);}
.attackBorder{outline:3px solid red;}
.city{background:gold;}
.selected{outline:3px solid black;}

.unitImg{width:100%;height:100%;object-fit:contain;}
.hp{position:absolute;bottom:2px;right:2px;color:white;background:black;font-size:12px;}
.mp{position:absolute;top:2px;left:2px;background:white;font-size:11px;}

.card{background:white;padding:10px;margin-bottom:10px;border-radius:10px;}
.buyBtn{width:100%;background:green;color:white;border:none;padding:6px;border-radius:6px;cursor:pointer;}

#menu{text-align:center;width:100%;}
#turnPanel{text-align:center;}

#logo{max-width:200px;display:block;margin:auto;}

.hitFlash{animation:hit 0.2s;}
@keyframes hit{0%{background:red;}100%{background:transparent;}}
</style>
</head>

<body>

<img src="img/logo.png" id="logo">

<div id="menu">
<input id="roomInput" placeholder="Кімната">
<select id="playerSelect">
<option value="1">Гравець 1</option>
<option value="2">Гравець 2</option>
</select>
<button id="joinBtn">Приєднатись</button>
</div>

<div class="panel" id="leftPanel"></div>

<div>
<div id="turnPanel">
Хід: <span id="turn"></span> |
Гравець: <span id="player"></span><br>
💰 <span id="money1"></span> | <span id="money2"></span>
</div>

<div id="grid"></div>

<button onclick="endTurn()" class="buyBtn">Закінчити хід</button>
<button onclick="resetState()" class="buyBtn">Нова гра</button>
</div>

<div class="panel" id="rightPanel"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSy...",
  databaseURL:"https://beluga-a7197-default-rtdb.firebaseio.com"
});
const db=getDatabase(app);

let width=18,height=10;
let currentPlayer=1,playerId=1,turn=1;
let selectedUnit=null,buyMode=null,room="";

const unitTypes={
 infantry:{name:"Піхота",speed:3,atk:20,hp:50,range:1,price:40000,img1:"img/infantry_p1.png",img2:"img/infantry_p2.png"},
};

let state={units:[],money:{1:500000,2:500000},cities:[{x:1,y:4},{x:16,y:4}]};

function createGrid(){
 grid.innerHTML='';
 for(let y=0;y<height;y++){
  for(let x=0;x<width;x++){
   let d=document.createElement('div');
   d.className='cell';
   if(x===8)d.classList.add('divider');
   d.onclick=()=>cellClick(x,y);
   grid.appendChild(d);
}}}

function getCell(x,y){return document.querySelectorAll('.cell')[y*width+x];}

function render(){
 turnEl.innerText=turn;
 playerEl.innerText=currentPlayer;
 money1.innerText=state.money[1];
 money2.innerText=state.money[2];

 document.querySelectorAll('.cell').forEach(c=>{c.innerHTML='';c.classList.remove('move','attackBorder','selected');});

 state.units.forEach(u=>{
  let cell=getCell(u.x,u.y);
  let img=document.createElement('img');
  img.src=u.owner===1?unitTypes[u.type].img1:unitTypes[u.type].img2;
  img.className='unitImg';
  cell.appendChild(img);
 });

 renderPanels();
}

window.render=render;

function renderPanels(){
 leftPanel.innerHTML='';
 rightPanel.innerHTML='';
 Object.keys(unitTypes).forEach(k=>{
  let u=unitTypes[k];
  leftPanel.innerHTML+=`<div class="card">${u.name}<button onclick="startBuy('${k}',1)" class="buyBtn">Купити</button></div>`;
  rightPanel.innerHTML+=`<div class="card">${u.name}<button onclick="startBuy('${k}',2)" class="buyBtn">Купити</button></div>`;
 });
}

window.startBuy=(t,p)=>{if(p===playerId)buyMode=t;}

function cellClick(x,y){
 if(!room)return;
 if(currentPlayer!==playerId)return;

 let unit=state.units.find(u=>u.x===x&&u.y===y);

 if(buyMode){
  let u=unitTypes[buyMode];
  state.money[playerId]-=u.price;
  state.units.push({x,y,owner:playerId,type:buyMode,hp:u.hp,movePoints:0,attacked:true});
  buyMode=null;saveState();render();return;
 }

 if(unit && unit.owner===playerId){selectedUnit=unit;return;}

 if(unit && unit.owner!==playerId && selectedUnit && !selectedUnit.attacked){
  unit.hp-=20;
  selectedUnit.attacked=true;
  if(unit.hp<=0)state.units=state.units.filter(u=>u!==unit);
  saveState();render();return;
 }
}

function endTurn(){
 if(currentPlayer!==playerId)return;
 currentPlayer=currentPlayer===1?2:1;
 saveState();render();
}

window.endTurn=endTurn;

function saveState(){if(room)set(ref(db,'games/'+room),{state,turn,currentPlayer});}

joinBtn.onclick=()=>{
 room=roomInput.value;
 playerId=parseInt(playerSelect.value);
 createGrid();render();
};

const turnEl=document.getElementById('turn');
const playerEl=document.getElementById('player');
const money1=document.getElementById('money1');
const money2=document.getElementById('money2');

createGrid();
render();
</script>

</body>
</html>
