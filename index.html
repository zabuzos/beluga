<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beluga 3 Multiplayer v2 - Editor Edition</title>
<style>
/* ... Твої існуючі стилі ... */
body {font-family: Arial;background:#f0f0f0;margin: 0; padding: 20px;}
.container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }

/* ТАБИ */
.nav-tabs { width: 100%; display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; }
.tab-btn { padding: 10px 20px; cursor: pointer; border: none; background: #ddd; border-radius: 5px; font-weight: bold; }
.tab-btn.active { background: #2196F3; color: white; }
.tab-content { display: none; width: 100%; }
.tab-content.active { display: block; }

/* РЕДАКТОР */
.editor-set { background: white; padding: 15px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #ccc; }
.unit-entry { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)) 40px; gap: 10px; background: #f9f9f9; padding: 10px; margin-top: 5px; border-radius: 5px; align-items: center;}
.unit-entry input { width: 100%; padding: 5px; border: 1px solid #ddd; }
.delete-btn { cursor: pointer; font-size: 20px; border: none; background: none; color: #f44336; }

/* Існуюча сітка та панелі */
#grid {display:grid;grid-template-columns: repeat(18, 60px);} 
.cell { width:60px; height:60px; border:1px solid rgba(0,0,0,0.1); position:relative; background-image: url('img/ground.png'); background-size: cover; opacity: 0.9;}
.panel { width: 220px; }
.card {background:white;padding:10px;margin-bottom:12px;border-radius:10px; text-align:center;}
.shopImg {width:100%;height:110px;object-fit:contain;margin:6px 0;}
.buyBtn {background: linear-gradient(180deg, #4CAF50, #2e7d32);border: none;border-radius: 8px;padding: 8px;color: white;font-weight: bold;cursor: pointer;width:100%;}
.unitImg {width:100%;height:100%;object-fit:contain;border-radius:6px;}
.unitP1 { outline:3px solid #2196F3; } .unitP2 { outline:3px solid #f44336; }
.hp {position:absolute;bottom:2px;right:2px;font-size:12px;color:white;background:rgba(0,0,0,0.6);padding:2px;}
</style>
</head>
<body>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="openTab(event, 'game-tab')">🎮 Гра</button>
    <button class="tab-btn" onclick="openTab(event, 'units-tab')">⚔️ Юніти (Редактор)</button>
</div>

<div id="game-tab" class="tab-content active">
    <div class="container">
        <div><img src="img/logo.png" id="logo" style="max-width:200px"></div>
        <div id="menu" style="width:100%; text-align:center;">
            <input type="text" id="roomInput" placeholder="Назва кімнати" />
            <select id="playerSelect">
                <option value="1">Гравець 1</option>
                <option value="2">Гравець 2</option>
            </select>
            <button id="joinBtn" class="tab-btn" style="background:#4CAF50; color:white;">Приєднатися</button>
        </div>
        
        <div class="panel" id="leftPanel"></div>
        
        <div>
            <div id="turnPanel" style="text-align:center;">
                <h3>Хід: <span id="turn">1</span> | Гравець: <span id="player">1</span><br>
                💰 P1: <span id="money1">0</span> | P2: <span id="money2">0</span></h3>
            </div>
            <div id="gridWrapper" style="overflow:auto;"><div id="grid"></div></div>
            <button onclick="endTurn()" class="buyBtn" id="endTurnBtn" style="margin-top:10px;">Закінчити хід</button>
        </div>
        
        <div class="panel" id="rightPanel"></div>
    </div>
</div>

<div id="units-tab" class="tab-content">
    <div style="max-width: 800px; margin: 0 auto;">
        <h2>Редактор юнітів</h2>
        <button class="buyBtn" onclick="addNewSet()" style="width: 200px; margin-bottom: 20px;">+ Створити новий комплект</button>
        <div id="setsContainer"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

// Конфігурація Firebase (твоя залишається без змін)
const firebaseConfig = {
  apiKey: "AIzaSyBM6L4pO6cCkCX6mhChNG0-5RxKYOIV1fY",
  authDomain: "beluga-a7197.firebaseapp.com",
  databaseURL: "https://beluga-a7197-default-rtdb.firebaseio.com",
  projectId: "beluga-a7197",
  storageBucket: "beluga-a7197.appspot.com",
  messagingSenderId: "1019986290981",

};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// === СТАН РЕДАКТОРА ===
let unitSets = [
    {
        name: "Класичний",
        units: {
            shooter: {name:"Стрілець", speed:1, atk:15, hp:50, range:3, price:50000, img1:"img/shooter_p1.png", img2:"img/shooter_p2.png"},
            infantry: {name:"Піхота", speed:3, atk:20, hp:50, range:1, price:40000, img1:"img/infantry_p1.png", img2:"img/infantry_p2.png"},
            cavalry: {name:"Кавалерія", speed:4, atk:20, hp:55, range:1, price:120000, img1:"img/cavalry_p1.png", img2:"img/cavalry_p2.png"}
        }
    }
];
let activeSetIndex = 0;

// === ЛОГІКА ТАБІВ ===
window.openTab = function(evt, tabName) {
    document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.getElementById(tabName).classList.add("active");
    evt.currentTarget.classList.add("active");
}

// === ЛОГІКА РЕДАКТОРА ===
window.addNewSet = function() {
    const setName = prompt("Назва комплекту:", "Новий сет");
    if(setName) {
        unitSets.push({ name: setName, units: {} });
        renderEditor();
    }
}

window.deleteSet = function(index) {
    if(confirm("Видалити весь комплект?")) {
        unitSets.splice(index, 1);
        renderEditor();
    }
}

window.addUnitToSet = function(setIdx) {
    const key = "unit_" + Date.now();
    unitSets[setIdx].units[key] = { name: "Новий", speed: 1, atk: 10, hp: 50, range: 1, price: 30000, img1: "img/infantry_p1.png", img2: "img/infantry_p2.png" };
    renderEditor();
}

window.deleteUnit = function(setIdx, key) {
    delete unitSets[setIdx].units[key];
    renderEditor();
}

window.updateUnit = function(setIdx, key, field, value) {
    unitSets[setIdx].units[key][field] = (field === 'name' || field.includes('img')) ? value : parseInt(value);
}

window.activateSet = function(index) {
    activeSetIndex = index;
    alert(`Комплект "${unitSets[index].name}" активовано для гри!`);
    render();
}

function renderEditor() {
    const container = document.getElementById('setsContainer');
    container.innerHTML = unitSets.map((set, sIdx) => `
        <div class="editor-set">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>📦 Набір: ${set.name}</h3>
                <div>
                    <button class="buyBtn" style="width:auto; background: #2196F3; margin-right:5px;" onclick="activateSet(${sIdx})">Активувати</button>
                    <button class="delete-btn" onclick="deleteSet(${sIdx})">🗑️</button>
                </div>
            </div>
            <div id="units-list-${sIdx}">
                ${Object.keys(set.units).map(key => {
                    const u = set.units[key];
                    return `
                        <div class="unit-entry">
                            <input type="text" value="${u.name}" onchange="updateUnit(${sIdx}, '${key}', 'name', this.value)" placeholder="Назва">
                            <input type="number" value="${u.speed}" onchange="updateUnit(${sIdx}, '${key}', 'speed', this.value)" title="Швидкість">
                            <input type="number" value="${u.atk}" onchange="updateUnit(${sIdx}, '${key}', 'atk', this.value)" title="Атака">
                            <input type="number" value="${u.hp}" onchange="updateUnit(${sIdx}, '${key}', 'hp', this.value)" title="HP">
                            <input type="number" value="${u.range}" onchange="updateUnit(${sIdx}, '${key}', 'range', this
