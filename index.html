<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Міні-гра – тактична</title>
<style>
body { font-family: Arial; padding:10px; background:#f5f5f5; display:flex; flex-direction:row; }
#gameArea { display:flex; }
#shopArea { width:220px; margin-right:10px; }
.unitCard { border:1px solid #ccc; border-radius:8px; margin-bottom:10px; padding:5px; text-align:center; background:white; }
.unitCard img { width:100%; height:80px; object-fit:contain; margin-bottom:5px; }
.unitCard button { background:#4CAF50; color:white; border:none; border-radius:5px; padding:6px 10px; cursor:pointer; margin-top:5px; width:90%; }
#field { display:grid; grid-template-columns: repeat(18, 40px); grid-template-rows: repeat(10, 40px); gap:2px; }
.cell { width:40px; height:40px; border:1px solid #aaa; position:relative; background:#eee; }
.cell.city { background:#ffd; }
.cell.highlightMove { background: rgba(0,255,0,0.4); }
.cell.highlightRemain { background: rgba(255,255,0,0.4); }
.cell.enemy { border:2px solid red; }
.unitIcon { width:36px; height:36px; position:absolute; top:2px; left:2px; border:2px solid transparent; border-radius:4px; }
.unitIcon.p1 { border-color:blue; }
.unitIcon.p2 { border-color:purple; }
.unitIcon.attackable:hover { cursor: url('🗡️'), auto; }
</style>
</head>
<body>

<div id="shopArea">
  <h3>Гравець 1 – Купити юніта</h3>
  <div id="shopP1"></div>
  <h3>Гравець 2 – Купити юніта</h3>

    💰 Бюджет P1: <span id="budgetP1"></span><br>
    💰 Бюджет P2: <span id="budgetP2"></span>
  </div>
</div>

<div id="gameArea">
  <div id="field"></div>
</div>
