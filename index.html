<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beluga 3 - Multiplayer</title>
<style>
/* BODY + CONTAINER */
body {
  font-family: Arial;
  background:#f0f0f0;
  margin:0;
}
#app {
  display:flex;
  gap:10px;
  padding:10px;
  overflow-x:auto;
}

/* PANELS */
.panel {
  width:220px;
  flex-shrink:0;
}

/* SHOP CARDS */
.card {
  background:white;
  padding:10px;
  margin-bottom:12px;
  border-radius:10px;
  text-align:center;
}
.shopImg {
  width:100%;
  height:100px;
  object-fit:contain;
  margin:6px 0;
}
.title {
  font-weight:bold;
}
.stats {
  font-size:14px;
  margin:4px 0;
}
.price {
  font-weight:bold;
  margin-bottom:6px;
}

/* GRID */
#grid {
  display:grid;
  grid-template-columns: repeat(18, 60px);
  min-width: max-content;
  gap:2px;
}
.cell {
  width:60px;
  height:60px;
  border:1px solid #ccc;
  position:relative;
}
.p1 { background:#d0f0ff; }
.p2 { background:#ffd0d0; }
.move { background:rgba(0,255,0,0.3); }
.future { background:rgba(255,255,0,0.3); }
.attackBorder {
  outline:3px solid red;
  cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><text y="24" font-size="24">⚔️</text></svg>') 0 24, auto;
}
.city { background:gold; }
.selected { outline:3px solid black; }

/* UNIT */
.unitImg {
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:6px;
}
.unitP1 { outline:3px solid #2196F3; }
.unitP2 { outline:3px solid #f44336; }
.hp {
  position:absolute;
  bottom:2px;
  right:2px;
  font-size:12px;
  color:white;
  background:rgba(0,0,0,0.6);
  padding:2px;
}
.mp {
  position:absolute;
  top:2px;
  left:2px;
  font-size:11px;
  background:white;
  padding:1px 3px;
  border-radius:4px;
}

/* BUTTON */
.buyBtn {
  background: linear-gradient(180deg, #4CAF50, #2e7d32);
  border: none;
  border-radius: 8px;
  padding: 8px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
  width:100%;
}
.buyBtn:hover { transform: scale(1.05); }
.buyBtn:active { transform: scale(0.95); }

</style>
</head>
<body>

<div id="app">

<div class="panel" id="leftPanel"></div>

<div>
<h3 style="text-align:center">
Хід: <span id="turn"></span> |
Гравець: <span id="player"></span><br>
💰 P1: <span id="money1"></span> |
P2: <span id="money2"></span>
</h3>
<div id="grid"></div>
<button onclick="endTurn()" class="buyBtn">Закінчити хід</button>
</div>

<div class="panel" id="rightPanel"></div>

</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-analytics.js";

const firebaseConfig = {
    apiKey: "AIzaSyBM6L4pO6cCkCX6mhChNG0-5RxKYOIV1fY",
    authDomain: "beluga-a7197.firebaseapp.com",
    projectId: "beluga-a7197",
    storageBucket: "beluga-a7197.firebasestorage.app",
    messagingSenderId: "1019986290981",
    appId: "1:1019986290981:web:1a0685a543fa63e5a152cc",
    measurementId: "G-09QQGZZ584"
};
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
</script>

<script>
const width = 18, height = 10;
let currentPlayer = 1, turn = 1, selectedUnit = null, buyMode = null;

function fm(n){ return Math.round(n/1000)+'к'; }

const unitTypes = {
  shooter:{name:"Стрілець", speed:1, atk:15, hp:50, range:3, price:50000, img1:"img/shooter_p1.png", img2:"img/shooter_p2.png"},
  infantry:{name:"Піхота", speed:3, atk:20, hp:50, range:1, price:40000, img1:"img/infantry_p1.png", img2:"img/infantry_p2.png"},
  cavalry:{name:"Кавалерія", speed:4, atk:20, hp:55, range:1, price:120000, img1:"img/cavalry_p1.png", img2:"img/cavalry_p2.png"}
};

let state = {
  units: [],
  money:{1:500000,2:500000},
  cities:[{x:1,y:4},{x:1,y:5},{x:16,y:4},{x:16,y:5}]
};

function createGrid(){
  let g=document.getElementById('grid'); g.innerHTML='';
  for(let y=0;y<height;y++){
    for(let x=0;x<width;x++){
      let d=document.createElement('div');
      d.className='cell '+(x<9?'p1':'p2');
      d.onclick=()=>cellClick(x,y);
      d.dataset.x=x; d.dataset.y=y;
      g.appendChild(d);
    }
  }
}
function getCell(x,y){ return document.querySelector(`.cell[data-x='${x}'][data-y='${y}']`); }

function renderPanels(){
  let html1='', html2='';
  Object.keys(unitTypes).forEach(k=>{
    let u=unitTypes[k];
    html1+=`
      <div class="card shopCard">
        <div class="title">${u.name}</div>
        <img src="${u.img1}" class="shopImg">
        <div class="stats">🏃 ${u.speed} ⚔️ ${u.atk} ❤️ ${u.hp} 🎯 ${u.range}</div>
        <div class="price">💰 ${fm(u.price)}</div>
        <button class="buyBtn" onclick="startBuy('${k}',1)" ${currentPlayer!==1?'disabled':''}>Купити</button>
      </div>`;
    html2+=`
      <div class="card shopCard">
        <div class="title">${u.name}</div>
        <img src="${u.img2}" class="shopImg">
        <div class="stats">🏃 ${u.speed} ⚔️ ${u.atk} ❤️ ${u.hp} 🎯 ${u.range}</div>
        <div class="price">💰 ${fm(u.price)}</div>
        <button class="buyBtn" onclick="startBuy('${k}',2)" ${currentPlayer!==2?'disabled':''}>Купити</button>
      </div>`;
  });
  leftPanel.innerHTML = html1;
  rightPanel.innerHTML = html2;
}

function startBuy(type,player){ if(currentPlayer===player) buyMode=type; }
function isOwnSide(x){ return currentPlayer===1?x<9:x>=9; }

function cellClick(x,y){
  let unit=state.units.find(u=>u.x===x&&u.y===y);
  if(buyMode){
    if(unit || !isOwnSide(x)) return;
    let u=unitTypes[buyMode];
    if(state.money[currentPlayer]<u.price) return;
    state.money[currentPlayer]-=u.price;
    state.units.push({x,y,owner:currentPlayer,type:buyMode,hp:u.hp,movePoints:0,attacked:true});
    buyMode=null; render(); return;
  }
  if(unit && unit.owner===currentPlayer){ selectedUnit=unit; render(); return; }
  if(unit && unit.owner!==currentPlayer && selectedUnit && !selectedUnit.attacked){ attackUnit(selectedUnit,unit); render(); return; }
  if(selectedUnit && selectedUnit.movePoints>0){ if(state.units.some(u=>u.x===x&&u.y===y)) return; moveUnit(selectedUnit,x,y); render(); }
}

function moveUnit(u,x,y){
  let dx=Math.abs(u.x-x), dy=Math.abs(u.y-y), dist=Math.max(dx,dy);
  if(dist<=u.movePoints){ u.movePoints-=dist; u.x=x; u.y=y; }
}

function attackUnit(a,d){
  let t=unitTypes[a.type], dx=Math.abs(a.x-d.x), dy=Math.abs(a.y-d.y);
  if(Math.max(dx,dy)<=t.range){ d.hp-=t.atk; a.attacked=true; if(d.hp<=0){ state.units=state.units.filter(u=>u!==d); } }
}

function highlightMoves(u){ let s=u.movePoints;
  for(let dx=-s;dx<=s;dx++){ for(let dy=-s;dy<=s;dy++){
    let nx=u.x+dx, ny=u.y+dy;
    if(nx>=0 && ny>=0 && nx<width && ny<height && Math.max(Math.abs(dx),Math.abs(dy))<=s){
      let cell=getCell(nx,ny); cell.classList.add(u.movePoints>0?'move':'future');
    }
  }}
}
function highlightAttacks(u){ let r=unitTypes[u.type].range;
  state.units.forEach(e=>{
    if(e.owner!==currentPlayer && !u.attacked){
      let dx=Math.abs(e.x-u.x), dy=Math.abs(e.y-u.y);
      if(Math.max(dx,dy)<=r){ getCell(e.x,e.y).classList.add('attackBorder'); }
    }
  });
}

function render(){
  turnEl.innerText=turn; playerEl.innerText=currentPlayer;
  money1.innerText=fm(state.money[1]); money2.innerText=fm(state.money[2]);
  document.querySelectorAll('.cell').forEach(c=>{c.innerHTML=''; c.classList.remove('move','future','attackBorder','selected','city');});
  state.cities.forEach(c=>getCell(c.x,c.y).classList.add('city'));
  state.units.forEach(u=>{
    let cell=getCell(u.x,u.y);
    let img=document.createElement('img'); img.src=u.owner===1?unitTypes[u.type].img1:unitTypes[u.type].img2;
    img.className='unitImg '+(u.owner===1?'unitP1':'unitP2'); cell.appendChild(img);
    let hp=document.createElement('div'); hp.className='hp'; hp.innerText=u.hp; cell.appendChild(hp);
    let mp=document.createElement('div'); mp.className='mp'; mp.innerText=u.movePoints; cell.appendChild(mp);
    if(u===selectedUnit) cell.classList.add('selected');
  });
  if(selectedUnit){ highlightMoves(selectedUnit); highlightAttacks(selectedUnit); }
  renderPanels();
}

function endTurn(){
  currentPlayer=currentPlayer===1?2:1;
  if(currentPlayer===1) turn++;
  state.money[currentPlayer]+=100000;
  state.units.forEach(u=>{ if(u.owner===currentPlayer){ u.movePoints=unitTypes[u.type].speed; u.attacked=false; } });
  selectedUnit=null; render();
}

const turnEl=document.getElementById('turn');
const playerEl=document.getElementById('player');
const money1=document.getElementById('money1');
const money2=document.getElementById('money2');

createGrid(); render();
</script>

</body>
</html>
