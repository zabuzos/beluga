<!DOCTYPE html>

<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beluga 3</title>

<style>
body {
  font-family: Arial;
  background:#f0f0f0;
  display:flex;
  justify-content:center;
  gap:20px;
}

/* GRID */
#grid {
  display:grid;
  grid-template-columns: repeat(18, 60px);
}

.cell {
  width:60px;
  height:60px;
  border:1px solid #ccc;
  position:relative;
}

.p1 { background:#d0f0ff; }
.p2 { background:#ffd0d0; }

.move { background:rgba(0,255,0,0.3); }
.future { background:rgba(255,255,0,0.3); }

.attackBorder {
  outline:3px solid red;
  cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><text y="24" font-size="24">⚔️</text></svg>') 0 24, auto;
}

.city { background:gold; }
.selected { outline:3px solid black; }

/* ЮНІТИ */
.unitImg {
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:6px;
}

.unitP1 { outline:3px solid #2196F3; }
.unitP2 { outline:3px solid #f44336; }

.hp {
  position:absolute;
  bottom:2px;
  right:2px;
  font-size:12px;
  color:white;
  background:rgba(0,0,0,0.6);
  padding:2px;
}

.mp {
  position:absolute;
  top:2px;
  left:2px;
  font-size:11px;
  background:white;
  padding:1px 3px;
  border-radius:4px;
}

/* ПАНЕЛІ */
.panel { width:220px; }

.card {
  background:white;
  padding:10px;
  margin-bottom:12px;
  border-radius:10px;
}

/* SHOP */
.shopCard { text-align:center; }

.shopImg {
  width:100%;
  height:110px;
  object-fit:contain;
  margin:6px 0;
}

.title {
  font-weight:bold;
  margin-bottom:4px;
}

.stats {
  font-size:14px;
  margin-bottom:4px;
}

.price {
  font-weight:bold;
  margin-bottom:6px;
}

/* КНОПКА */
.buyBtn {
  background: linear-gradient(180deg, #4CAF50, #2e7d32);
  border: none;
  border-radius: 8px;
  padding: 8px;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
  width:100%;
}

.buyBtn:hover { transform: scale(1.05); }
.buyBtn:active { transform: scale(0.95); }

.buyBtn:disabled {
  background: #999;
  cursor: not-allowed;
  transform:none;
}

</style>

</head>

<body>

<div class="panel" id="leftPanel"></div>

<div>
<h3 style="text-align:center">
Хід: <span id="turn"></span> |
Гравець: <span id="player"></span><br>
💰 P1: <span id="money1"></span> |
P2: <span id="money2"></span>
</h3>

<div id="grid"></div>
<button onclick="endTurn()" class="buyBtn">Закінчити хід</button>
</div>

<div class="panel" id="rightPanel"></div>

<script>
const width = 18;
const height = 10;

let currentPlayer = 1;
let turn = 1;
let selectedUnit = null;
let buyMode = null;

function fm(n){ return (n/1000)+'к'; }

// --- ЮНІТИ ---
const unitTypes = {
  shooter:{
    name:"Стрілець",
    speed:1, atk:15, hp:50, range:3, price:50000,
    img1:"img/shooter_p1.png",
    img2:"img/shooter_p2.png"
  },
  infantry:{
    name:"Піхота",
    speed:3, atk:20, hp:50, range:1, price:40000,
    img1:"img/infantry_p1.png",
    img2:"img/infantry_p2.png"
  },
  cavalry:{
    name:"Кавалерія",
    speed:4, atk:20, hp:55, range:1, price:120000,
    img1:"img/cavalry_p1.png",
    img2:"img/cavalry_p2.png"
  }
};

// --- STATE ---
let state = {
  units: [],
  money:{1:500000,2:500000},
  cities:[
    {x:1,y:4},{x:1,y:5},
    {x:16,y:4},{x:16,y:5}
  ]
};

// --- GRID ---
function createGrid(){
  let g=document.getElementById('grid');
  g.innerHTML='';
  for(let y=0;y<height;y++){
    for(let x=0;x<width;x++){
      let d=document.createElement('div');
      d.className='cell '+(x<9?'p1':'p2');
      d.onclick=()=>cellClick(x,y);
      d.dataset.x=x;
      d.dataset.y=y;
      g.appendChild(d);
    }
  }
}

function getCell(x,y){
  return document.querySelector(`.cell[data-x='${x}'][data-y='${y}']`);
}

// --- RENDER ---
function render(){
  turnEl.innerText=turn;
  playerEl.innerText=currentPlayer;
  money1.innerText=fm(state.money[1]);
  money2.innerText=fm(state.money[2]);

  document.querySelectorAll('.cell').forEach(c=>{
    c.innerHTML='';
    c.classList.remove('move','future','attackBorder','selected','city');
  });

  state.cities.forEach(c=>{
  let cell = getCell(c.x,c.y);
  cell.classList.add('city');

  let icon = document.createElement('div');
  icon.innerText = "🏰";
  icon.style.position = "absolute";
  icon.style.top = "50%";
  icon.style.left = "50%";
  icon.style.transform = "translate(-50%, -50%)";
  icon.style.fontSize = "26px";

  cell.appendChild(icon);
});

  state.units.forEach(u=>{
    let cell=getCell(u.x,u.y);

    let img=document.createElement('img');
    img.src = u.owner===1
      ? unitTypes[u.type].img1
      : unitTypes[u.type].img2;

    img.className='unitImg '+(u.owner===1?'unitP1':'unitP2');
    cell.appendChild(img);

    let hp=document.createElement('div');
    hp.className='hp';
    hp.innerText=u.hp;
    cell.appendChild(hp);

    let mp=document.createElement('div');
    mp.className='mp';
    mp.innerText=u.movePoints;
    cell.appendChild(mp);

    if(u===selectedUnit) cell.classList.add('selected');
  });

  if(selectedUnit){
    highlightMoves(selectedUnit);
    highlightAttacks(selectedUnit);
  }

  renderPanels();
}

// --- SHOP (ВИПРАВЛЕНО) ---
function renderPanels(){

  // P1
  let html1='';
  Object.keys(unitTypes).forEach(k=>{
    let u=unitTypes[k];

    html1+=`
    <div class='card shopCard'>
      <div class="title">${u.name}</div>

      <img src="${u.img1}" class="shopImg">

      <div class="stats">
        🏃 ${u.speed} ⚔️ ${u.atk} ❤️ ${u.hp} 🎯 ${u.range}
      </div>

      <div class="price">💰 ${fm(u.price)}</div>

      <button class="buyBtn"
        onclick="startBuy('${k}',1)"
        ${currentPlayer!==1 ? 'disabled' : ''}>
        Купити
      </button>
    </div>`;
  });

  // P2
  let html2='';
  Object.keys(unitTypes).forEach(k=>{
    let u=unitTypes[k];

    html2+=`
    <div class='card shopCard'>
      <div class="title">${u.name}</div>

      <img src="${u.img2}" class="shopImg">

      <div class="stats">
        🏃 ${u.speed} ⚔️ ${u.atk} ❤️ ${u.hp} 🎯 ${u.range}
      </div>

      <div class="price">💰 ${fm(u.price)}</div>

      <button class="buyBtn"
        onclick="startBuy('${k}',2)"
        ${currentPlayer!==2 ? 'disabled' : ''}>
        Купити
      </button>
    </div>`;
  });

  leftPanel.innerHTML = html1;
  rightPanel.innerHTML = html2;
}

// --- BUY (ВИПРАВЛЕНО) ---
function startBuy(type, player){
  if(player !== currentPlayer) return;
  buyMode = type;
}

function isOwnSide(x){ return currentPlayer===1?x<9:x>=9; }

// --- CLICK ---
function cellClick(x,y){
  let unit=state.units.find(u=>u.x===x&&u.y===y);

  if(buyMode){
    if(unit || !isOwnSide(x)) return;

    let u=unitTypes[buyMode];
    if(state.money[currentPlayer]<u.price) return;

    state.money[currentPlayer]-=u.price;

    state.units.push({
      x,y,
      owner:currentPlayer,
      type:buyMode,
      hp:u.hp,
      movePoints:0,
      attacked:true
    });

    buyMode=null;
    render();
    return;
  }

  if(unit && unit.owner===currentPlayer){
    selectedUnit=unit;
    render();
    return;
  }

  if(unit && unit.owner!==currentPlayer && selectedUnit && !selectedUnit.attacked){
    attackUnit(selectedUnit,unit);
    render();
    return;
  }

  if(selectedUnit && selectedUnit.movePoints>0){
    if(state.units.some(u=>u.x===x&&u.y===y)) return;
    moveUnit(selectedUnit,x,y);
    render();
  }
}

// --- MOVE ---
function moveUnit(u,x,y){
  let dx=Math.abs(u.x-x);
  let dy=Math.abs(u.y-y);
  let dist=Math.max(dx,dy);

  if(dist<=u.movePoints){
    u.movePoints-=dist;
    u.x=x;
    u.y=y;
  }
}

// --- ATTACK ---
function attackUnit(a,d){
  let t=unitTypes[a.type];
  let dx=Math.abs(a.x-d.x);
  let dy=Math.abs(a.y-d.y);

  if(Math.max(dx,dy)<=t.range){
    d.hp-=t.atk;
    a.attacked=true;

    if(d.hp<=0){
      state.units = state.units.filter(u=>u!==d);
    }
  }
}

// --- HIGHLIGHT ---
function highlightMoves(u){
  let s=u.movePoints;

  for(let dx=-s;dx<=s;dx++){
    for(let dy=-s;dy<=s;dy++){
      let nx=u.x+dx;
      let ny=u.y+dy;

      if(nx>=0 && ny>=0 && nx<width && ny<height &&
         Math.max(Math.abs(dx),Math.abs(dy))<=s){

        let cell=getCell(nx,ny);
        if(u.movePoints>0) cell.classList.add('move');
        else cell.classList.add('future');
      }
    }
  }
}

function highlightAttacks(u){
  let r=unitTypes[u.type].range;

  state.units.forEach(e=>{
    if(e.owner!==currentPlayer && !u.attacked){
      let dx=Math.abs(e.x-u.x);
      let dy=Math.abs(e.y-u.y);

      if(Math.max(dx,dy)<=r){
        getCell(e.x,e.y).classList.add('attackBorder');
      }
    }
  });
}

// --- TURN ---
function endTurn(){
  currentPlayer = currentPlayer===1 ? 2 : 1;
  if(currentPlayer===1) turn++;

  state.money[currentPlayer]+=100000;

  state.units.forEach(u=>{
    if(u.owner===currentPlayer){
      u.movePoints = unitTypes[u.type].speed;
      u.attacked = false;
    }
  });

  selectedUnit=null;
  render();
}

// --- START ---
const turnEl=document.getElementById('turn');
const playerEl=document.getElementById('player');
const money1=document.getElementById('money1');
const money2=document.getElementById('money2');

createGrid();
render();
</script>

</body>
</html>
