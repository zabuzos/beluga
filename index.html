<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beluga Battle - PC Edition</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; margin: 0; padding: 15px; }
        .nav { display: flex; gap: 15px; margin-bottom: 25px; justify-content: center; }
        .tab-btn { padding: 12px 25px; cursor: pointer; border: none; background: #95a5a6; border-radius: 8px; font-weight: bold; font-size: 16px; }
        .tab-btn.active { background: #3498db; color: white; }
        .tab-content { display: none; }
        
        #gridWrapper { 
            overflow: auto; border: 5px solid #000; border-radius: 12px; 
            background-image: url('https://raw.githubusercontent.com/zabuzos/beluga/main/img/ground.png');
            background-size: 60px 60px; width: fit-content; margin: 0 auto; max-width: 100%;
        }
        #grid { display: grid; grid-template-columns: repeat(18, 60px); background: rgba(0,0,0,0.2); }
        .cell { width: 60px; height: 60px; border: 1px solid rgba(255,255,255,0.1); position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 35px; }
        .divider { border-right: 4px dashed gold !important; }
        
        #menu { background: #34495e; padding: 30px; border-radius: 20px; text-align: center; max-width: 450px; margin: 40px auto; }
        .menu-row { margin-bottom: 20px; }
        input, select { padding: 12px; border-radius: 6px; border: none; width: 100%; box-sizing: border-box; font-size: 16px; }
        
        .panel { width: 280px; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; }
        .card { background: #ecf0f1; color: #333; padding: 10px; margin-bottom: 15px; border-radius: 10px; text-align: center; }
        .shopImg { width: 100%; height: 70px; object-fit: contain; }
        
        .unitImg { width: 85%; height: 85%; object-fit: contain; position: absolute; pointer-events: none; z-index: 2; }
        .unitP1 { filter: drop-shadow(0 0 8px #3498db); }
        .unitP2 { filter: drop-shadow(0 0 8px #e74c3c); }
        .hp { position: absolute; bottom: 4px; right: 4px; font-size: 12px; background: red; color: white; padding: 2px 5px; border-radius: 4px; z-index: 3; font-weight: bold; }

        .btn { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-danger { background: #e74c3c; width: auto; padding: 5px 10px; }

        .city { background: rgba(241, 196, 15, 0.45) !important; border: 2px solid #f1c40f !important; }
        .selected { outline: 4px solid white; box-shadow: 0 0 20px white; z-index: 5; }
        .container { display: flex; justify-content: center; gap: 25px; }

        .unit-edit-card { background: #2c3e50; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #3498db; }
        .preview-box { width: 45px; height: 45px; background: #34495e; margin-right: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 4px; }
    </style>
</head>
<body>

<div class="nav">
    <button class="tab-btn active" onclick="openTab(event, 'game-tab')">ГРАТИ</button>
    <button class="tab-btn" onclick="openTab(event, 'army-tab')">АРМІЯ</button>
</div>

<div id="game-tab" class="tab-content" style="display: block;">
    <div id="menu">
        <h1 style="color: #f1c40f;">⚔️ BELUGA BATTLE</h1>
        <div class="menu-row"><input type="text" id="roomInput" placeholder="Код кімнати"></div>
        <div class="menu-row">
            <select id="playerSelect">
                <option value="1">Гравець 1 (Сині)</option>
                <option value="2">Гравець 2 (Червоні)</option>
            </select>
        </div>
        <div class="menu-row">
            <select id="teamSelect"></select>
        </div>
        <button class="btn" id="joinBtn" style="font-size: 18px; padding: 15px;">УВІЙТИ В БИТВУ</button>
    </div>

    <div id="gameArea" style="display: none;">
        <div class="container">
            <div class="panel" id="leftPanel"></div>
            <div class="main-game-block">
                <div id="turnPanel" style="background: #34495e; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                    <span>Хід: <b id="turn">1</b> | P<b id="playerDisplay">1</b></span>
                    <span>💰 <b id="myMoney">0</b>к</span>
                    <button id="endTurnBtn" style="background: #e67e22; border: none; color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer;">OK</button>
                </div>
                <div id="gridWrapper"><div id="grid"></div></div>
            </div>
            <div class="panel" id="rightPanel"></div>
        </div>
    </div>
</div>

<div id="army-tab" class="tab-content">
    <div style="max-width: 800px; margin: 0 auto;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
            <h2>🛠️ Редактор Рас</h2>
            <button class="btn" style="width:auto;" id="addRaceBtn">+ Нова раса</button>
        </div>
        <div id="armyList"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBM6L4pO6cCkCX6mhChNG0-5RxKYOIV1fY",
    databaseURL: "https://beluga-a7197-default-rtdb.firebaseio.com",
    projectId: "beluga-a7197"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const DEFAULT_RACE = {
    name: "Люди",
    units: {
        u1: { name: "Мечник", speed: 3, atk: 20, hp: 60, range: 1, price: 40000, img: "https://raw.githubusercontent.com/zabuzos/beluga/main/img/infantry_p1.png" }
    }
};

let userArmies = JSON.parse(localStorage.getItem('beluga_user_armies')) || [DEFAULT_RACE];
let state = { units: [], money: {1: 500000, 2: 500000}, cities: [], playerConfigs: {} };
let room = "", playerId = 1, currentPlayer = 1, turn = 1, selectedUnit = null, buyMode = null;

// Функції навігації (винесені у window)
window.openTab = (e, id) => {
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).style.display = 'block';
    e.currentTarget.classList.add('active');
    if(id === 'army-tab') renderArmyEditor();
};

function saveAndRefresh() {
    localStorage.setItem('beluga_user_armies', JSON.stringify(userArmies));
    renderArmyEditor();
    updateTeamList();
}

window.deleteUnit = (aIdx, uId) => {
    delete userArmies[aIdx].units[uId];
    saveAndRefresh();
};

window.updateUnitField = (aIdx, uId, field, val) => {
    userArmies[aIdx].units[uId][field] = (field === 'name' || field === 'img') ? val : parseInt(val);
    localStorage.setItem('beluga_user_armies', JSON.stringify(userArmies));
    if(field === 'img') renderArmyEditor();
};

window.handleFileUpload = (e, aIdx, uId) => {
    const reader = new FileReader();
    reader.onload = (ev) => { window.updateUnitField(aIdx, uId, 'img', ev.target.result); };
    if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
};

function renderArmyEditor() {
    const container = document.getElementById('armyList');
    container.innerHTML = userArmies.map((army, aIdx) => `
        <div style="background: rgba(0,0,0,0.2); padding: 15px; border-radius: 10px; margin-bottom: 25px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <h3 style="color:#f1c40f; margin:0;">🛡️ ${army.name}</h3>
                <button class="btn btn-danger" onclick="window.deleteRace(${aIdx})">Видалити расу</button>
            </div>
            ${Object.keys(army.units).map(uId => `
                <div class="unit-edit-card">
                    <div style="display:flex; align-items:center; margin-bottom:10px;">
                        <div class="preview-box">${army.units[uId].img ? `<img src="${army.units[uId].img}" style="width:100%">` : ''}</div>
                        <input type="text" value="${army.units[uId].name}" onchange="window.updateUnitField(${aIdx},'${uId}','name',this.value)" style="flex:1;">
                        <button class="btn btn-danger" style="margin-left:10px;" onclick="window.deleteUnit(${aIdx},'${uId}')">🗑️</button>
                    </div>
                    <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:5px; margin-bottom:10px;">
                        <input type="number" value="${army.units[uId].price}" onchange="window.updateUnitField(${aIdx},'${uId}','price',this.value)" title="Ціна">
                        <input type="number" value="${army.units[uId].hp}" onchange="window.updateUnitField(${aIdx},'${uId}','hp',this.value)" title="HP">
                        <input type="number" value="${army.units[uId].atk}" onchange="window.updateUnitField(${aIdx},'${uId}','atk',this.value)" title="ATK">
                        <input type="number" value="${army.units[uId].speed}" onchange="window.updateUnitField(${aIdx},'${uId}','speed',this.value)" title="SPD">
                        <input type="number" value="${army.units[uId].range}" onchange="window.updateUnitField(${aIdx},'${uId}','range',this.value)" title="RNG">
                    </div>
                    <input type="file" accept="image/*" onchange="window.handleFileUpload(event, ${aIdx}, '${uId}')" style="font-size:11px;">
                </div>
            `).join('')}
            <button class="btn" onclick="window.addUnit(${aIdx})" style="background:#3498db; margin-top:10px;">+ Додати юніта</button>
        </div>
    `).join('');
}

window.deleteRace = (idx) => { if(confirm("Видалити?")) { userArmies.splice(idx,1); saveAndRefresh(); } };
window.addUnit = (idx) => { 
    const id = 'u' + Date.now(); 
    userArmies[idx].units[id] = { name: "Воїн", price: 50000, hp: 100, atk: 10, speed: 3, range: 1, img: "" }; 
    saveAndRefresh(); 
};
document.getElementById('addRaceBtn').onclick = () => {
    const n = prompt("Назва раси:"); if(n) { userArmies.push({name:n, units:{}}); saveAndRefresh(); }
};

// ГРА
document.getElementById('joinBtn').onclick = async () => {
    room = document.getElementById('roomInput').value.trim();
    playerId = parseInt(document.getElementById('playerSelect').value);
    const armyIdx = document.getElementById('teamSelect').value;
    if(!room || !userArmies[armyIdx]) return alert("Перевірте код кімнати та обрану расу");

    const snap = await get(ref(db, 'games/'+room));
    if(!snap.exists()) {
        state = { units: [], money: {1:500000, 2:500000}, cities: generateCities(), playerConfigs: {} };
    } else {
        state = snap.val().state; turn = snap.val().turn; currentPlayer = snap.val().currentPlayer;
    }
    state.playerConfigs[playerId] = userArmies[armyIdx];
    await set(ref(db, 'games/'+room
