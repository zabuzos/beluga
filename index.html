<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beluga Battle - Fix</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; margin: 0; padding: 15px; }
        .nav { display: flex; gap: 15px; margin-bottom: 25px; justify-content: center; }
        .tab-btn { padding: 12px 25px; cursor: pointer; border: none; background: #95a5a6; border-radius: 8px; font-weight: bold; font-size: 16px; }
        .tab-btn.active { background: #3498db; color: white; }
        .tab-content { display: none; }
        #gridWrapper { overflow: auto; border: 5px solid #000; border-radius: 12px; background-image: url('https://raw.githubusercontent.com/zabuzos/beluga/main/img/ground.png'); background-size: 60px 60px; width: fit-content; margin: 0 auto; max-width: 100%; }
        #grid { display: grid; grid-template-columns: repeat(18, 60px); background: rgba(0,0,0,0.2); }
        .cell { width: 60px; height: 60px; border: 1px solid rgba(255,255,255,0.1); position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 35px; }
        .divider { border-right: 4px dashed gold !important; }
        #menu { background: #34495e; padding: 30px; border-radius: 20px; text-align: center; max-width: 450px; margin: 40px auto; }
        .panel { width: 280px; min-height: 400px; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; }
        .card { background: #ecf0f1; color: #333; padding: 10px; margin-bottom: 15px; border-radius: 10px; text-align: center; font-size: 13px; }
        .shopImg { width: 100%; height: 60px; object-fit: contain; background: #ddd; border-radius: 5px; margin: 5px 0; }
        .unitImg { width: 85%; height: 85%; object-fit: contain; position: absolute; pointer-events: none; z-index: 2; }
        .unitP1 { filter: drop-shadow(0 0 8px #3498db); }
        .unitP2 { filter: drop-shadow(0 0 8px #e74c3c); }
        .hp { position: absolute; bottom: 4px; right: 4px; font-size: 12px; background: red; color: white; padding: 2px 5px; border-radius: 4px; z-index: 3; font-weight: bold; }
        .btn { background: #27ae60; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .city { background: rgba(241, 196, 15, 0.4) !important; border: 2px solid gold !important; }
        .selected { outline: 4px solid white; box-shadow: 0 0 20px white; z-index: 5; }
        .editor-box { background: #2c3e50; padding: 15px; border-radius: 8px; border: 1px solid #444; margin-bottom: 10px; }
        input { background: #34495e; color: white; border: 1px solid #555; padding: 5px; border-radius: 4px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="nav">
    <button class="tab-btn active" onclick="window.openTab(event, 'game-tab')">ГРАТИ</button>
    <button class="tab-btn" onclick="window.openTab(event, 'army-tab')">АРМІЯ</button>
</div>

<div id="game-tab" class="tab-content" style="display: block;">
    <div id="menu">
        <h1 style="color: #f1c40f;">⚔️ BELUGA BATTLE</h1>
        <input type="text" id="roomInput" placeholder="Код кімнати" style="margin-bottom:10px; padding:10px;">
        <select id="playerSelect" style="margin-bottom:10px; padding:10px; width:100%; background:#34495e; color:white; border-radius:5px;">
            <option value="1">Гравець 1 (Сині - Зліва)</option>
            <option value="2">Гравець 2 (Червоні - Справа)</option>
        </select>
        <select id="teamSelect" style="margin-bottom:20px; padding:10px; width:100%; background:#34495e; color:white; border-radius:5px;"></select>
        <button class="btn" id="joinBtn">УВІЙТИ В БИТВУ</button>
    </div>
    <div id="gameArea" style="display: none;">
        <div style="display:flex; justify-content:center; gap:20px;">
            <div class="panel" id="leftPanel"></div>
            <div>
                <div id="turnPanel" style="background:#34495e; padding:10px; border-radius:10px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;">
                    <span>Хід: <b id="turn">1</b> | P<b id="playerDisplay">1</b></span>
                    <span>💰 <b id="myMoney">0</b>к</span>
                    <button onclick="window.endTurn()" style="background:#e67e22; color:white; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">OK</button>
                </div>
                <div id="gridWrapper"><div id="grid"></div></div>
            </div>
            <div class="panel" id="rightPanel"></div>
        </div>
    </div>
</div>

<div id="army-tab" class="tab-content">
    <div style="max-width:850px; margin:0 auto; background:#34495e; padding:20px; border-radius:15px;">
        <button class="btn" style="background:#27ae60; margin-bottom:20px;" onclick="window.addNewArmy()">+ Створити нову расу</button>
        <div id="armyList"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = { apiKey: "AIzaSyBM6L4pO6cCkCX6mhChNG0-5RxKYOIV1fY", databaseURL: "https://beluga-a7197-default-rtdb.firebaseio.com", projectId: "beluga-a7197" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const DEFAULT_RACE = {
    name: "Люди",
    units: {
        u1: { name: "Мечник", speed: 3, atk: 20, hp: 60, range: 1, price: 40000, img: "https://raw.githubusercontent.com/zabuzos/beluga/main/img/infantry_p1.png" },
        u2: { name: "Лучник", speed: 2, atk: 15, hp: 40, range: 3, price: 60000, img: "https://raw.githubusercontent.com/zabuzos/beluga/main/img/shooter_p1.png" }
    }
};

let stored = localStorage.getItem('beluga_user_armies');
window.userArmies = (stored && JSON.parse(stored).length > 0) ? JSON.parse(stored) : [DEFAULT_RACE];

let state = { units: [], money: {1: 500000, 2: 500000}, cities: [{x:0, y:2}, {x:0, y:7}, {x:17, y:2}, {x:17, y:7}], playerConfigs: {} };
let room = "", playerId = 1, currentPlayer = 1, turn = 1, selectedUnit = null, buyMode = null;

// --- ТАБИ ТА РЕДАКТОР ---
window.openTab = (e, id) => {
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).style.display = 'block';
    if(e) e.currentTarget.classList.add('active');
    if(id === 'army-tab') window.renderArmyEditor();
};

window.updateTeamList = () => {
    const sel = document.getElementById('teamSelect');
    if(sel) sel.innerHTML = window.userArmies.map((a, i) => `<option value="${i}">${a.name}</option>`).join('');
};

window.saveAndRefresh = () => {
    localStorage.setItem('beluga_user_armies', JSON.stringify(window.userArmies));
    window.updateTeamList();
    window.renderArmyEditor();
};

window.addNewArmy = () => {
    const n = prompt("Назва раси:");
    if(n) { window.userArmies.push({name: n, units: {}}); window.saveAndRefresh(); }
};

window.renderArmyEditor = () => {
    const list = document.getElementById('armyList');
    list.innerHTML = window.userArmies.map((army, aIdx) => `
        <div style="background:rgba(0,0,0,0.2); padding:15px; border-radius:10px; margin-bottom:20px; border: 1px solid #555;">
            <input type="text" value="${army.name}" onchange="window.userArmies[${aIdx}].name=this.value; window.saveAndRefresh()" style="font-size:18px; color:gold; border:none; border-bottom:1px solid gold; width:200px; margin-bottom:15px; background:none;">
            <button onclick="window.userArmies.splice(${aIdx},1); window.saveAndRefresh()" style="float:right; color:red; background:none; border:none; cursor:pointer;">Видалити расу</button>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                ${Object.keys(army.units).map(uId => `
                    <div class="editor-box">
                        <input type="text" value="${army.units[uId].name}" onchange="window.userArmies[${aIdx}].units['${uId}'].name=this.value; window.saveAndRefresh()" style="margin-bottom:5px;">
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                            <input type="number" placeholder="Ціна" value="${army.units[uId].price}" onchange="window.userArmies[${aIdx}].units['${uId}'].price=parseInt(this.value); window.saveAndRefresh()">
                            <input type="number" placeholder="HP" value="${army.units[uId].hp}" onchange="window.userArmies[${aIdx}].units['${uId}'].hp=parseInt(this.value); window.saveAndRefresh()">
                            <input type="number" placeholder="SPD" value="${army.units[uId].speed}" onchange="window.userArmies[${aIdx}].units['${uId}'].speed=parseInt(this.value); window.saveAndRefresh()">
                            <input type="number" placeholder="ATK" value="${army.units[uId].atk || 10}" onchange="window.userArmies[${aIdx}].units['${uId}'].atk=parseInt(this.value); window.saveAndRefresh()">
                        </div>
                        <input type="text" placeholder="URL картинки" value="${army.units[uId].img || ''}" onchange="window.userArmies[${aIdx}].units['${uId}'].img=this.value; window.saveAndRefresh()" style="margin-top:5px;">
                        <button onclick="delete window.userArmies[${aIdx}].units['${uId}']; window.saveAndRefresh()" style="width:100%; margin-top:5px; color:red; border:none; background:none; cursor:pointer;">Видалити юніта</button>
                    </div>
                `).join('')}
            </div>
            <button class="btn" style="margin-top:10px; background:#3498db;" onclick="const id='u'+Date.now(); window.userArmies[${aIdx}].units[id]={name:'Воїн',speed:3,atk:10,hp:100,range:1,price:50000,img:''}; window.saveAndRefresh()">+ Додати воїна</button>
        </div>
    `).join('');
};

// --- ГРА ---
document.getElementById('joinBtn').onclick = async () => {
    room = document.getElementById('roomInput').value.trim();
    playerId = parseInt(document.getElementById('playerSelect').value);
    const armyIdx = document.getElementById('teamSelect').value;
    if(!room || !window.userArmies[armyIdx]) return alert("Вкажіть кімнату та расу!");

    // Локально ставимо расу відразу
    state.playerConfigs[playerId] = window.userArmies[armyIdx];

    const snap = await get(ref(db, 'games/'+room));
    if(!snap.exists()) {
        state.units = []; state.money = {1:500000, 2:500000};
        state.cities = [{x:0, y:2}, {x:0, y:7}, {x:17, y:2}, {x:17, y:7}];
    } else {
        const d = snap.val();
        state.units = d.state.units || [];
        state.money = d.state.money || {1:500000, 2:500000};
        Object.assign(state.playerConfigs, d.state.playerConfigs);
        turn = d.turn; currentPlayer = d.currentPlayer;
    }

    window.saveGame();
    document.getElementById('menu').style.display = 'none';
    document.getElementById('gameArea').style.display = 'block';
    window.createGrid();
    window.render();

    onValue(ref(db, 'games/'+room), (s) => {
        const d = s.val(); if(d) { state = d.state; turn = d.turn; currentPlayer = d.currentPlayer; window.render(); window.checkWin(); }
    });
};

window.saveGame = () => set(ref(db, 'games/'+room), { state, turn, currentPlayer });

window.createGrid = () => {
    const g = document.getElementById('grid'); g.innerHTML = '';
    for(let y=0; y<10; y++) {
        for(let x=0; x<18; x++) {
            const d = document.createElement('div'); d.className = 'cell';
            if(x === 8) d.classList.add('divider');
            d.id = `c-${x}-${y}`; d.onclick = () => window.cellClick(x, y);
            g.appendChild(d);
        }
    }
};

window.cellClick = (x, y) => {
    if(currentPlayer !== playerId) return;
    const unitAtCell = state.units.find(u => u.x === x && u.y === y);

    if(buyMode) {
        const cfg = state.playerConfigs[playerId].units[buyMode];
        const isMyHalf = (playerId === 1 && x < 9) || (playerId === 2 && x > 8);
        if(!unitAtCell && isMyHalf && (state.money[playerId] >= cfg.price)) {
            state.money[playerId] -= cfg.price;
            state.units.push({ x, y, owner: playerId, type: buyMode, hp: cfg.hp, movePoints: 0, attacked: true });
            buyMode = null; window.saveGame();
        }
        return;
    }

    if(unitAtCell && unitAtCell.owner === playerId) { selectedUnit = unitAtCell; window.render(); return; }
    
    if(selectedUnit && !unitAtCell) {
        const dist = Math.max(Math.abs(selectedUnit.x - x), Math.abs(selectedUnit.y - y));
        if(dist <= selectedUnit.movePoints) {
            selectedUnit.x = x; selectedUnit.y = y; selectedUnit.movePoints -= dist; window.saveGame();
        }
    }
};

window.endTurn = () => {
    if(currentPlayer !== playerId) return;
    currentPlayer = (currentPlayer === 1) ? 2 : 1;
    if(currentPlayer === 1) turn++;
    state.money[currentPlayer] += 100000;
    state.units.forEach(u => { 
        if(u.owner === currentPlayer) { 
            const cfg = state.playerConfigs[u.owner]?.units[u.type]; 
            u.movePoints = cfg ? cfg.speed : 1; u.attacked = false; 
        } 
    });
    window.saveGame();
};

window.render = () => {
    document.getElementById('turn').innerText = turn;
    document.getElementById('playerDisplay').innerText = currentPlayer;
    document.getElementById('myMoney').innerText = Math.floor((state.money[playerId] || 0)/1000);
    document.querySelectorAll('.cell').forEach(c => { c.innerHTML = ''; c.classList.remove('selected','city'); });
    state.cities.forEach(c => { const cell = document.getElementById(`c-${c.x}-${c.y}`); if(cell) { cell.classList.add('city'); cell.innerHTML = '🏰'; } });
    state.units.forEach(u => {
        const cell = document.getElementById(`c-${u.x}-${u.y}`);
        const cfg = state.playerConfigs[u.owner]?.units[u.type];
        if(!cell || !cfg) return;
        const img = document.createElement('img'); img.className = 'unitImg '+(u.owner===1?'unitP1':'unitP2'); img.src = cfg.img;
        img.onerror = () => { img.style.display='none'; cell.innerHTML += (u.owner===1?'🟦':'🟥'); };
        cell.appendChild(img);
        const hpLabel = document.createElement('div'); hpLabel.className = 'hp'; hpLabel.innerText = u.hp; cell.appendChild(hpLabel);
        if(u === selectedUnit) cell.classList.add('selected');
    });
    window.renderShop();
};

window.renderShop = () => {
    [1,2].forEach(p => {
        const target = p === 1 ? 'leftPanel' : 'rightPanel';
        const panel = document.getElementById(target);
        
        // Використовуємо або дані з сервера, або власні локальні, якщо сервер ще не синхронізував
        let config = state.playerConfigs[p];
        if(!config && p === playerId) {
            const armyIdx = document.getElementById('teamSelect').value;
            config = window.userArmies[armyIdx];
        }

        if(!config) { panel.innerHTML = `<p style="text-align:center; opacity:0.5; margin-top:100px;">P${p} підключається...</p>`; return; }
        
        let html = `<h3 style="text-align:center; color:${p===1?'#3498db':'#e74c3c'}">${config.name}</h3>`;
        Object.keys(config.units).forEach(k => {
            const u = config.units[k];
            html += `<div class="card" style="border-left: 5px solid ${p===1?'#3498db':'#e74c3c'}">
                <b>${u.name}</b><br>
                <img src="${u.img}" class="shopImg" onerror="this.src='https://via.placeholder.com/60?text=UNIT'">
                <div style="font-size:11px; margin-bottom:5px;">❤️${u.hp} | 👟${u.speed} | ⚔️${u.atk || 10}</div>
                <button class="btn" style="padding:6px; font-size:12px; background:${p===playerId && currentPlayer===playerId?'#27ae60':'#95a5a6'}" 
                    onclick="window.setBuy('${k}')" ${playerId!==p||currentPlayer!==p?'disabled':''}>🛒 ${u.price/1000}k</button>
            </div>`;
        });
        panel.innerHTML = html;
    });
};

window.setBuy = (k) => { buyMode = k; };
window.checkWin = () => {
    const p1C = state.cities.filter(c => c.x === 0), p2C = state.cities.filter(c => c
