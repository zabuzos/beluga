<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beluga 3 Multiplayer v2</title>
<style>
body {font-family: Arial;background:#f0f0f0;display:flex;justify-content:center;gap:20px;flex-wrap: wrap;}
#grid {display:grid;grid-template-columns: repeat(18, 60px);} 
.cell { width:60px; height:60px; border:1px solid rgba(0,0,0,0.1); position:relative;
  background-image: url('img/ground.png'); background-size: cover; background-repeat: repeat; opacity: 0.9;}
.panel { width: 220px;}
@media (max-width: 768px) {
  .panel { width: 95%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  #grid { grid-template-columns: repeat(18, 40px); }
  .cell { width: 40px; height: 40px; }
  body { flex-direction: column; align-items: center; }
}
.shopCard { text-align:center; background:white;padding:10px;margin-bottom:12px;border-radius:10px;}
.shopImg {width:100%;height:110px;object-fit:contain;margin:6px 0;}
.title {font-weight:bold;margin-bottom:4px;} .stats {font-size:14px;margin-bottom:4px;} .price {font-weight:bold;margin-bottom:6px;}
.buyBtn {background: linear-gradient(180deg, #4CAF50, #2e7d32);border: none;border-radius: 8px;padding: 8px;color: white;font-weight: bold;cursor: pointer;width:100%;}
.buyBtn:hover { transform: scale(1.05); } .buyBtn:active { transform: scale(0.95); } .buyBtn:disabled {background: #999;cursor: not-allowed;}
#menu {width: 100%;text-align: center;margin-bottom: 10px;}
#turnPanel {text-align: center;margin-bottom: 10px;}
.unitImg {width:100%;height:100%;object-fit:contain;border-radius:6px;}
.hp {position:absolute;bottom:2px;right:2px;font-size:12px;color:white;background:rgba(0,0,0,0.6);padding:2px;}
.mp {position:absolute;top:2px;left:2px;font-size:11px;background:white;padding:1px 3px;border-radius:4px;}
.move { background:rgba(0,255,0,0.3); } .future { background:rgba(255,255,0,0.3); }
.attackBorder { outline:3px solid red; cursor: pointer; }
.attackBorder:hover { cursor: url('data:image/svg+xml;utf8,\
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32">\
<text y="24" font-size="24">⚔️</text>\
</svg>') 0 24, auto; }
.city { background:gold; } .selected { outline:3px solid black; }
</style>
</head>
<body>
<div><img src="img/logo.png" id="logo"></div>

<!-- Вкладки -->
<div id="menu">
  <button id="tabGameBtn">Гра</button>
  <button id="tabUnitsBtn">Юніти</button>
  <button id="tabMapBtn">Карта</button>
</div>

<div class="panel" id="leftPanel"></div>

<div>
  <div id="turnPanel">
    <h3>
      Хід: <span id="turn"></span> |
      Гравець: <span id="player"></span><br>
      💰 P1: <span id="money1"></span> |
      P2: <span id="money2"></span>
    </h3>
  </div>

 <div id="gridWrapper">
  <div id="grid"></div>
</div>
  <button id="endTurnBtn" class="buyBtn">Закінчити хід</button>
  <button id="resetBtn" class="buyBtn" style="margin-top:10px;">Нова гра</button>
</div>

<div class="panel" id="rightPanel"></div>

<!-- Вкладка Юніти -->
<div id="unitsTab" style="display:none; width:100%; max-width:500px; margin:10px auto;">
  <h3>Створити команду</h3>
  <input type="text" id="teamNameInput" placeholder="Назва команди" />
  <button id="addTeamBtn">Додати команду</button>
  
  <h4>Юніти в команді</h4>
  <div id="teamUnits"></div>

  <h4>Доступні юніти</h4>
  <div id="availableUnits"></div>
</div>

<!-- Вкладка Карта -->
<div id="mapTab" style="display:none; width:100%; max-width:800px; margin:10px auto;">
  <h3>Редактор карти</h3>
  <p>Тут буде можливість малювати клітинки, міста, воду.</p>
</div>

<script>
/* --------- JS після HTML --------- */
const tabGameBtn = document.getElementById('tabGameBtn');
const tabUnitsBtn = document.getElementById('tabUnitsBtn');
const tabMapBtn = document.getElementById('tabMapBtn');
const gridWrapper = document.getElementById('gridWrapper');
const leftPanel = document.getElementById('leftPanel');
const rightPanel = document.getElementById('rightPanel');
const unitsTab = document.getElementById('unitsTab');
const mapTab = document.getElementById('mapTab');
const turnEl = document.getElementById('turn');
const playerEl = document.getElementById('player');
const money1 = document.getElementById('money1');
const money2 = document.getElementById('money2');
const endTurnBtn = document.getElementById('endTurnBtn');
const resetBtn = document.getElementById('resetBtn');

tabGameBtn.addEventListener('click',()=>showTab('game'));
tabUnitsBtn.addEventListener('click',()=>showTab('unitsTab'));
tabMapBtn.addEventListener('click',()=>showTab('mapTab'));

function showTab(tabId){
  gridWrapper.style.display = tabId==='game'?'block':'none';
  leftPanel.style.display = tabId==='game'?'block':'none';
  rightPanel.style.display = tabId==='game'?'block':'none';
  unitsTab.style.display = tabId==='unitsTab'?'block':'none';
  mapTab.style.display = tabId==='mapTab'?'block':'none';
}

/* ----- Юніти / команди ----- */
const availableUnitsDiv = document.getElementById('availableUnits');
const teamUnitsDiv = document.getElementById('teamUnits');
let teams = JSON.parse(localStorage.getItem('teams')) || [];
let currentTeam = {name:'', units:[]};

const unitTypes = {
  shooter:{name:"Стрілець", speed:1, atk:15, hp:50, range:3, price:50000},
  infantry:{name:"Піхота", speed:3, atk:20, hp:50, range:1, price:40000},
  cavalry:{name:"Кавалерія", speed:4, atk:20, hp:55, range:1, price:120000}
};

function renderAvailableUnits(){
  availableUnitsDiv.innerHTML='';
  Object.keys(unitTypes).forEach(k=>{
    let u = unitTypes[k];
    let div = document.createElement('div');
    div.innerHTML = `<b>${u.name}</b> 🏃 ${u.speed} ⚔️ ${u.atk} ❤️ ${u.hp} 🎯 ${u.range} 💰 ${u.price}
      <button onclick="addUnitToTeam('${k}')">Додати</button>`;
    availableUnitsDiv.appendChild(div);
  });
}
function addUnitToTeam(type){ currentTeam.units.push(type); renderTeamUnits(); }
function renderTeamUnits(){ 
  teamUnitsDiv.innerHTML='';
  currentTeam.units.forEach((t,i)=>{ 
    let div=document.createElement('div'); 
    div.innerHTML=`${unitTypes[t].name} <button onclick="removeUnit(${i})">❌</button>`; 
    teamUnitsDiv.appendChild(div); 
  }); 
}
function removeUnit(i){ currentTeam.units.splice(i,1); renderTeamUnits(); }

document.getElementById('addTeamBtn').addEventListener('click',()=>{
  let name = document.getElementById('teamNameInput').value.trim();
  if(!name) return alert('Введіть назву команди!');
  currentTeam.name = name;
  teams.push({...currentTeam});
  localStorage.setItem('teams', JSON.stringify(teams));
  currentTeam = {name:'', units:[]};
  document.getElementById('teamNameInput').value='';
  teamUnitsDiv.innerHTML='';
  alert('Команда додана!');
});

renderAvailableUnits();

/* ----- Прості дані гри ----- */
const width=18, height=10;
let state={units:[],money:{1:500000,2:500000},cities:[{x:1,y:4},{x:1,y:5},{x:16,y:4},{x:16,y:5}]};
let currentPlayer=1, turn=1, selectedUnit=null;

const grid=document.getElementById('grid');
function createGrid(){
  grid.innerHTML='';
  for(let y=0;y<height;y++){
    for(let x=0;x<width;x++){
      let d=document.createElement('div'); d.className='cell';
      d.dataset.x=x; d.dataset.y=y;
      grid.appendChild(d);
    }
  }
}
function render(){
  turnEl.innerText=turn;
  playerEl.innerText=currentPlayer;
}
createGrid();
render();

endTurnBtn.addEventListener('click',()=>{
  currentPlayer = currentPlayer===1?2:1;
  turn++;
  render();
});
resetBtn.addEventListener('click',()=>{ state.units=[]; turn=1; currentPlayer=1; render(); });
</script>
</body>
</html>
