<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beluga 3 Multiplayer</title>
<style>
/* ...Всю твою існуючу стилізацію залишаємо без змін... */
</style>
</head>
<body>

<!-- Лобі для вибору кімнати та гравця -->
<div id="lobby">
  <h2>Beluga Multiplayer</h2>
  <label>Назва кімнати: <input type="text" id="roomInput" placeholder="Room1"></label><br><br>
  <label>Вибір гравця:
    <select id="playerSelect">
      <option value="1">P1</option>
      <option value="2">P2</option>
    </select>
  </label><br><br>
  <button id="joinBtn" class="buyBtn">Приєднатись</button>
</div>

<!-- Ігрова зона -->
<div id="gameArea" style="display:none;">
  <div class="panel" id="leftPanel"></div>
  <div>
    <h3 style="text-align:center">
      Хід: <span id="turn"></span> |
      Гравець: <span id="player"></span><br>
      💰 P1: <span id="money1"></span> |
      P2: <span id="money2"></span>
    </h3>
    <div id="grid"></div>
    <button onclick="endTurn()" class="buyBtn">Закінчити хід</button>
    <button onclick="newGame()" class="buyBtn">Нова гра</button>
  </div>
  <div class="panel" id="rightPanel"></div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set, onValue, update } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

// --- Firebase config ---
const firebaseConfig = {
  apiKey: "AIzaSyBM6L4pO6cCkCX6mhChNG0-5RxKYOIV1fY",
  authDomain: "beluga-a7197.firebaseapp.com",
  databaseURL: "https://beluga-a7197-default-rtdb.firebaseio.com",
  projectId: "beluga-a7197",
  storageBucket: "beluga-a7197.appspot.com",
  messagingSenderId: "1019986290981",
  appId: "1:1019986290981:web:1a0685a543fa63e5a152cc"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// --- Глобальні змінні ---
let room, playerNum;
let state = null;
let buyMode = null;
let selectedUnit = null;

// --- ЮНІТИ ---
const unitTypes = {
  shooter:{name:"Стрілець", speed:1, atk:15, hp:50, range:3, price:50000,img1:"img/shooter_p1.png", img2:"img/shooter_p2.png"},
  infantry:{name:"Піхота", speed:3, atk:20, hp:50, range:1, price:40000,img1:"img/infantry_p1.png", img2:"img/infantry_p2.png"},
  cavalry:{name:"Кавалерія", speed:4, atk:20, hp:55, range:1, price:120000,img1:"img/cavalry_p1.png", img2:"img/cavalry_p2.png"}
};

// --- GRID ---
const width = 18, height = 10;
function createGrid(){
  const g=document.getElementById('grid'); g.innerHTML='';
  for(let y=0;y<height;y++){
    for(let x=0;x<width;x++){
      const c=document.createElement('div');
      c.className='cell '+(x<9?'p1':'p2');
      c.dataset.x=x; c.dataset.y=y;
      c.onclick=()=>cellClick(x,y);
      g.appendChild(c);
    }
  }
}
function getCell(x,y){ return document.querySelector(`.cell[data-x='${x}'][data-y='${y}']`); }

// --- Лобі ---
document.getElementById('joinBtn').onclick = ()=>{
  room = document.getElementById('roomInput').value.trim();
  playerNum = parseInt(document.getElementById('playerSelect').value);
  if(!room){ alert("Введіть кімнату"); return; }

  const roomRef = ref(db, 'rooms/'+room);
  // Якщо нова кімната, ініціалізуємо
  set(roomRef, {
    turn:1,
    currentPlayer:1,
    money:{1:500000,2:500000},
    units:[],
    cities:[{x:1,y:4},{x:1,y:5},{x:16,y:4},{x:16,y:5}]
  }, {merge:true});

  document.getElementById('lobby').style.display='none';
  document.getElementById('gameArea').style.display='flex';

  onValue(roomRef, snap=>{ state=snap.val(); render(); });
  createGrid();
};

// --- RENDER ---
function fm(n){ return Math.round(n/1000)+'к'; }
function render(){
  if(!state) return;

  document.getElementById('turn').innerText = state.turn;
  document.getElementById('player').innerText = state.currentPlayer;
  document.getElementById('money1').innerText = fm(state.money[1]);
  document.getElementById('money2').innerText = fm(state.money[2]);

  document.querySelectorAll('.cell').forEach(c=>{
    c.innerHTML=''; c.classList.remove('move','future','attackBorder','selected','city');
  });

  state.cities.forEach(c=>{
    const cell = getCell(c.x,c.y);
    cell.classList.add('city');
    const icon=document.createElement('div');
    icon.innerText="🏰"; icon.style.position="absolute";
    icon.style.top="50%"; icon.style.left="50%";
    icon.style.transform="translate(-50%,-50%)";
    icon.style.fontSize="26px";
    cell.appendChild(icon);
  });

  state.units.forEach(u=>{
    const cell=getCell(u.x,u.y);
    const img=document.createElement('img');
    img.src = u.owner===1?unitTypes[u.type].img1:unitTypes[u.type].img2;
    img.className='unitImg '+(u.owner===1?'unitP1':'unitP2'); cell.appendChild(img);

    const hp=document.createElement('div'); hp.className='hp'; hp.innerText=u.hp; cell.appendChild(hp);
    const mp=document.createElement('div'); mp.className='mp'; mp.innerText=u.movePoints; cell.appendChild(mp);

    if(u===selectedUnit) cell.classList.add('selected');
  });

  renderPanels();
}

// --- SHOP ---
function renderPanels(){
  let html1='', html2='';
  Object.keys(unitTypes).forEach(k=>{
    const u=unitTypes[k];
    html1+=`<div class='card shopCard'><div class="title">${u.name}</div>
      <img src="${u.img1}" class="shopImg">
      <div class="stats">🏃 ${u.speed} ⚔️ ${u.atk} ❤️ ${u.hp} 🎯 ${u.range}</div>
      <div class="price">💰 ${fm(u.price)}</div>
      <button class="buyBtn" onclick="startBuy('${k}')" ${playerNum!==1?'disabled':''}>Купити</button>
    </div>`;
    html2+=`<div class='card shopCard'><div class="title">${u.name}</div>
      <img src="${u.img2}" class="shopImg">
      <div class="stats">🏃 ${u.speed} ⚔️ ${u.atk} ❤️ ${u.hp} 🎯 ${u.range}</div>
      <div class="price">💰 ${fm(u.price)}</div>
      <button class="buyBtn" onclick="startBuy('${k}')" ${playerNum!==2?'disabled':''}>Купити</button>
    </div>`;
  });
  leftPanel.innerHTML=html1; rightPanel.innerHTML=html2;
}

// --- BUY ---
function startBuy(type){
  if(!state || playerNum!==state.currentPlayer) return;
  buyMode=type;
}

// --- CLICK ---
function cellClick(x,y){
  if(!state || playerNum!==state.currentPlayer) return;

  const unit=state.units.find(u=>u.x===x&&u.y===y);

  if(buyMode){
    if(unit || (playerNum===1?x>=9:x<9)) return;
    const uType=unitTypes[buyMode];
    if(state.money[playerNum]<uType.price) return;
    state.money[playerNum]-=uType.price;
    state.units.push({x,y,type:buyMode,owner:playerNum,hp:uType.hp,movePoints:uType.speed,attacked:false});
    buyMode=null;
    update(ref(db,'rooms/'+room), state); return;
  }

  // Тут можна додати вибір та атаки
}

// --- END TURN ---
function endTurn(){
  if(!state || playerNum!==state.currentPlayer) return;

  state.currentPlayer = state.currentPlayer===1?2:1;
  if(state.currentPlayer===1) state.turn++;
  state.money[state.currentPlayer]+=100000;
  state.units.forEach(u=>{ if(u.owner===state.currentPlayer){ u.movePoints=unitTypes[u.type].speed; u.attacked=false; } });
  selectedUnit=null;

  update(ref(db,'rooms/'+room), state);
}

// --- NEW GAME ---
function newGame(){
  if(!room) return;
  set(ref(db,'rooms/'+room),{
    turn:1,currentPlayer:1,
    money:{1:500000,2:500000},
    units:[], cities:[{x:1,y:4},{x:1,y:5},{x:16,y:4},{x:16,y:5}]
  });
}

// --- START ---
createGrid();
</script>

</body>
</html>
