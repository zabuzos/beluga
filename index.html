<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beluga Battle - Unique Races</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; margin: 0; padding: 15px; }
        .nav { display: flex; gap: 15px; margin-bottom: 25px; justify-content: center; }
        .tab-btn { padding: 12px 25px; cursor: pointer; border: none; background: #95a5a6; border-radius: 8px; font-weight: bold; font-size: 16px; }
        .tab-btn.active { background: #3498db; color: white; }
        .tab-content { display: none; }
        
        #gridWrapper { 
            overflow: auto; border: 5px solid #000; border-radius: 12px; 
            background-image: url('https://raw.githubusercontent.com/zabuzos/beluga/main/img/ground.png');
            background-size: 60px 60px; width: fit-content; margin: 0 auto; max-width: 100%;
        }
        #grid { display: grid; grid-template-columns: repeat(18, 60px); background: rgba(0,0,0,0.2); }
        .cell { width: 60px; height: 60px; border: 1px solid rgba(255,255,255,0.1); position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 35px; }
        .divider { border-right: 4px dashed gold !important; }
        
        #menu { background: #34495e; padding: 30px; border-radius: 20px; text-align: center; max-width: 450px; margin: 40px auto; }
        .menu-row { margin-bottom: 20px; }
        input, select { padding: 12px; border-radius: 6px; border: none; width: 100%; box-sizing: border-box; font-size: 16px; }
        
        .panel { width: 280px; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; }
        .card { background: #ecf0f1; color: #333; padding: 12px; margin-bottom: 15px; border-radius: 10px; text-align: center; }
        .shopImg { width: 100%; height: 70px; object-fit: contain; }
        
        .unitImg { width: 85%; height: 85%; object-fit: contain; position: absolute; pointer-events: none; z-index: 2; }
        .unitP1 { filter: drop-shadow(0 0 8px #3498db); }
        .unitP2 { filter: drop-shadow(0 0 8px #e74c3c); }
        .hp { position: absolute; bottom: 4px; right: 4px; font-size: 12px; background: red; color: white; padding: 2px 5px; border-radius: 4px; z-index: 3; font-weight: bold; }

        .btn { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .city { background: rgba(241, 196, 15, 0.45) !important; border: 2px solid #f1c40f !important; }
        .selected { outline: 4px solid white; box-shadow: 0 0 20px white; z-index: 5; }
        .container { display: flex; justify-content: center; gap: 25px; }

        @media (max-width: 1200px) {
            .container { flex-direction: column; align-items: center; }
            .panel { width: 100%; display: flex; overflow-x: auto; gap: 15px; }
            .card { min-width: 160px; }
        }
    </style>
</head>
<body>

<div class="nav">
    <button class="tab-btn active" onclick="openTab(event, 'game-tab')">ГРАТИ</button>
    <button class="tab-btn" onclick="openTab(event, 'army-tab')">АРМІЯ</button>
</div>

<div id="game-tab" class="tab-content" style="display: block;">
    <div id="menu">
        <h1 style="color: #f1c40f;">⚔️ BELUGA BATTLE</h1>
        <div class="menu-row"><input type="text" id="roomInput" placeholder="Код кімнати"></div>
        <div class="menu-row">
            <select id="playerSelect">
                <option value="1">Гравець 1 (Сині)</option>
                <option value="2">Гравець 2 (Червоні)</option>
            </select>
        </div>
        <div class="menu-row">
            <label style="display:block; margin-bottom:5px; font-size:14px;">Обери свою расу:</label>
            <select id="teamSelect"></select>
        </div>
        <button class="btn" id="joinBtn" style="font-size: 18px; padding: 15px;">УВІЙТИ В БИТВУ</button>
    </div>

    <div id="gameArea" style="display: none;">
        <div class="container">
            <div class="panel" id="leftPanel"></div>
            <div class="main-game-block">
                <div id="turnPanel" style="background: #34495e; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                    <span>Хід: <b id="turn">1</b> | P<b id="playerDisplay">1</b></span>
                    <span>💰 <b id="myMoney">0</b>к</span>
                    <button onclick="window.endTurn()" style="background: #e67e22; border: none; color: white; padding: 10px 20px; border-radius: 6px; cursor: pointer;">OK</button>
                </div>
                <div id="gridWrapper"><div id="grid"></div></div>
            </div>
            <div class="panel" id="rightPanel"></div>
        </div>
    </div>
</div>

<div id="army-tab" class="tab-content">
    <div class="editor-container" style="max-width: 900px; margin: 0 auto; background: #34495e; padding: 25px; border-radius: 15px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <h2 style="margin:0;">🛠️ Редактор Рас</h2>
            <button class="btn" style="width: auto; padding: 10px 20px;" onclick="addNewArmy()">+ Створити нову расу</button>
        </div>
        <div id="armyList"></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyBM6L4pO6cCkCX6mhChNG0-5RxKYOIV1fY",
    databaseURL: "https://beluga-a7197-default-rtdb.firebaseio.com",
    projectId: "beluga-a7197"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const DEFAULT_RACE = {
    name: "Люди",
    units: {
        u1: { name: "Мечник", speed: 3, atk: 20, hp: 60, range: 1, price: 40000, img: "https://raw.githubusercontent.com/zabuzos/beluga/main/img/infantry_p1.png" },
        u2: { name: "Лучник", speed: 2, atk: 15, hp: 40, range: 3, price: 60000, img: "https://raw.githubusercontent.com/zabuzos/beluga/main/img/shooter_p1.png" }
    }
};

let userArmies = JSON.parse(localStorage.getItem('beluga_user_armies')) || [DEFAULT_RACE];
let state = { units: [], money: {1: 500000, 2: 500000}, cities: [], playerConfigs: {} };
let room = "", playerId = 1, currentPlayer = 1, turn = 1, selectedUnit = null, buyMode = null;

window.openTab = (e, id) => {
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).style.display = 'block';
    e.currentTarget.classList.add('active');
    if(id === 'army-tab') renderArmyEditor();
};

window.addNewArmy = () => {
    const name = prompt("Назва раси:");
    if(name) { userArmies.push({ name, units: {} }); saveAndRefresh(); }
};

window.updateArmyName = (armyIdx, newName) => {
    userArmies[armyIdx].name = newName;
    localStorage.setItem('beluga_user_armies', JSON.stringify(userArmies));
    updateTeamList(); // Щоб в меню вибору раси ім'я змінилося одразу
};

window.addUnitToArmy = (armyIdx) => {
    const id = 'u' + Date.now();
    userArmies[armyIdx].units[id] = { name: "Воїн", speed: 3, atk: 10, hp: 100, range: 1, price: 50000, img: "" };
    saveAndRefresh();
};

window.deleteUnit = (armyIdx, uId) => {
    if(confirm("Видалити цього юніта?")) {
        delete userArmies[armyIdx].units[uId];
        saveAndRefresh();
    }
};

window.updateUnitField = (armyIdx, uId, field, val) => {
    userArmies[armyIdx].units[uId][field] = (field === 'name' || field === 'img') ? val : parseInt(val);
    localStorage.setItem('beluga_user_armies', JSON.stringify(userArmies));
};

function saveAndRefresh() {
    localStorage.setItem('beluga_user_armies', JSON.stringify(userArmies));
    renderArmyEditor();
    updateTeamList();
}

function renderArmyEditor() {
    const container = document.getElementById('armyList');
    container.innerHTML = userArmies.map((army, aIdx) => `
        <div class="editor-set" style="margin-bottom:30px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; gap:10px;">
                <div style="display:flex; align-items:center; gap:10px; flex:1;">
                    <span style="font-size:20px;">🛡️</span>
                    <input type="text" value="${army.name}" onchange="updateArmyName(${aIdx}, this.value)" 
                        style="background:none; color:#f1c40f; border:none; border-bottom:1px dashed #f1c40f; font-size:18px; font-weight:bold; width:200px; padding:2px;">
                </div>
                <button onclick="deleteArmy(${aIdx})" style="color:#ff4757; background:none; border:1px solid #ff4757; padding:5px 10px; border-radius:4px; cursor:pointer;">Видалити расу</button>
            </div>
            ${Object.keys(army.units).map(uId => `
                <div style="background:#2c3e50; padding:15px; margin-bottom:10px; border-radius:8px; position:relative;">
                    <button onclick="window.deleteUnit(${aIdx}, '${uId}')" style="position:absolute; top:10px; right:10px; background:none; border:none; color:#ff4757; cursor:pointer; font-size:18px;" title="Видалити юніта">🗑️</button>
                    <input type="text" value="${army.units[uId].name}" onchange="updateUnitField(${aIdx}, '${uId}', 'name', this.value)" style="background:#34495e; color:white; border:none; padding:8px; width:85%; font-weight:bold; margin-bottom:10px;">
                    <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:10px;">
                        <label style="font-size:11px;">💰 Ціна <input type="number" value="${army.units[uId].price}" onchange="updateUnitField(${aIdx}, '${uId}', 'price', this.value)"></label>
                        <label style="font-size:11px;">❤️ HP <input type="number" value="${army.units[uId].hp}" onchange="updateUnitField(${aIdx}, '${uId}', 'hp', this.value)"></label>
                        <label style="font-size:11px;">⚔️ ATK <input type="number" value="${army.units[uId].atk}" onchange="updateUnitField(${aIdx}, '${uId}', 'atk', this.value)"></label>
                        <label style="font-size:11px;">👟 SPD <input type="number" value="${army.units[uId].speed}" onchange="updateUnitField(${aIdx}, '${uId}', 'speed', this.value)"></label>
                        <label style="font-size:11px;">🎯 RNG <input type="number" value="${army.units[uId].range}" onchange="updateUnitField(${aIdx}, '${uId}', 'range', this.value)"></label>
                    </div>
                    <input type="text" placeholder="URL картинки" value="${army.units[uId].img || ''}" onchange="updateUnitField(${aIdx}, '${uId}', 'img', this.value)" style="width:100%; margin-top:10px; font-size:12px;">
                </div>
            `).join('')}
            <button class="btn" style="background:#3498db;" onclick="addUnitToArmy(${aIdx})">+ Додати юніта до ${army.name}</button>
        </div>
    `).join('');
}

window.deleteArmy = (idx) => { if(confirm("Видалити расу?")) { userArmies.splice(idx,1); saveAndRefresh(); } };

function updateTeamList() {
    const sel = document.getElementById('teamSelect');
    if(sel) sel.innerHTML = userArmies.map((a, i) => `<option value="${i}">${a.name}</option>`).join('');
}

document.getElementById('joinBtn').onclick = async () => {
    room = document.getElementById('roomInput').value.trim();
    playerId = parseInt(document.getElementById('playerSelect').value);
    const armyIdx = document.getElementById('teamSelect').value;
    const mySelectedRace = userArmies[armyIdx];
    if(!room) return alert("Введіть код кімнати");
    if(!mySelectedRace) return alert("Створіть расу!");

    const snap = await get(ref(db, 'games/'+room));
    if(!snap.exists()) {
        state = { units: [], money: {1:500000, 2:500000}, cities: generateRandomCities(), playerConfigs: {} };
        turn = 1; currentPlayer = 1;
    } else {
        const d = snap.val(); state = d.state; turn = d.turn; currentPlayer = d.currentPlayer;
    }
    if(!state.playerConfigs) state.playerConfigs = {};
    state.playerConfigs[playerId] = mySelectedRace;

    await set(ref(db, 'games/'+room), { state, turn, currentPlayer });
    document.getElementById('menu').style.display = 'none';
    document.getElementById('gameArea').style.display = 'block';
    createGrid();
    onValue(ref(db, 'games/'+room), (s) => {
        const d = s.val(); if(d) { state = d.state; turn = d.turn; currentPlayer = d.currentPlayer; render(); }
    });
};

function generateRandomCities() {
    const c = [];
    for(let i=0; i<2; i++) c.push({ x: Math.floor(Math.random()*2), y: Math.floor(Math.random()*10) });
    for(let i=0; i<2; i++) c.push({ x: 16 + Math.floor(Math.random()*2), y: Math.floor(Math.random()*10) });
    return c;
}

function createGrid() {
    const g = document.getElementById('grid'); g.innerHTML = '';
    for(let y=0; y<10; y++) {
        for(let x=0; x<18; x++) {
            const d = document.createElement('div'); d.className = 'cell';
            if(x === 8) d.classList.add('divider');
            d.id = `c-${x}-${y}`; d.onclick = () => cellClick(x, y);
            g.appendChild(d);
        }
    }
}

function cellClick(x, y) {
    if(currentPlayer !== playerId) return;
    const unit = (state.units || []).find(u => u.x === x && u.y === y);
    if(buyMode) {
        const myRace = state.playerConfigs[playerId];
        const uInfo = myRace.units[buyMode];
        const isMyCity = (state.cities || []).some(c => c.x === x && c.y === y && ((playerId === 1 && x < 2) || (playerId === 2 && x > 15)));
        if(!unit && isMyCity && state.money[playerId] >= uInfo.price) {
            state.money[playerId] -= uInfo.price;
            state.units.push({ x, y, owner: playerId, type: buyMode, hp: uInfo.hp, movePoints: 0, attacked: true });
            buyMode = null; save();
        }
        return;
    }
    if(unit && unit.owner === playerId) { selectedUnit = unit; render(); return; }
    if(selectedUnit && !unit) {
        const dist = Math.max(Math.abs(selectedUnit.x - x), Math.abs(selectedUnit.y - y));
        if(dist <= selectedUnit.movePoints) {
            selectedUnit.x = x; selectedUnit.y = y; selectedUnit.movePoints -= dist; save();
        }
    }
}

window.endTurn = () => {
    if(currentPlayer !== playerId) return;
    currentPlayer = currentPlayer === 1 ? 2 : 1;
    if(currentPlayer === 1) turn++;
    state.money[currentPlayer] += 100000;
    (state.units || []).forEach(u => {
        if(u.owner === currentPlayer) {
            const myRace = state.playerConfigs[u.owner];
            const cfg = myRace?.units[u.type];
            u.movePoints = cfg ? cfg.speed : 1; u.attacked = false;
        }
    });
    save();
};

function save() { set(ref(db, 'games/'+room), { state, turn, currentPlayer }); }

function render() {
    document.getElementById('turn').innerText = turn;
    document.getElementById('playerDisplay').innerText = currentPlayer;
    document.getElementById('myMoney').innerText = Math.floor((state.money[playerId] || 0)/1000);
    document.querySelectorAll('.cell').forEach(c => { c.innerHTML = ''; c.classList.remove('selected','city'); });
    
    (state.cities || []).forEach(c => {
        const cell = document.getElementById(`c-${c.x}-${c.y}`);
        if(cell) { cell.classList.add('city'); cell.innerHTML = '🏰'; }
    });

    (state.units || []).forEach(u => {
        const cell = document.getElementById(`c-${u.x}-${u.y}`);
        const myRace = state.playerConfigs[u.owner];
        const config = myRace?.units[u.type];
        if(!cell || !config) return;

        // Перевірка: якщо картинки немає, ставимо іконку-заглушку
        if (config.img && config.img.trim() !== "") {
            const img = document.createElement('img');
            img.src = config.img;
            img.className = 'unitImg ' + (u.owner === 1 ? 'unitP1' : 'unitP2');
            // Обробка помилки 404 для картинки
            img.onerror = function() {
                this.style.display = 'none';
                cell.innerHTML += u.owner === 1 ? '🟦' : '🟥';
            };
            cell.appendChild(img);
        } else {
            cell.innerHTML += u.owner === 1 ? '🟦' : '🟥';
        }

        const hp = document.createElement('div'); 
        hp.className = 'hp'; 
        hp.innerText = u.hp; 
        cell.appendChild(hp);
        
        if(u === selectedUnit) cell.classList.add('selected');
    });
    renderShop();
}

function renderShop() {
    const draw = (p) => {
        const target = p === 1 ? 'leftPanel' : 'rightPanel';
        const config = state.playerConfigs[p];
        if(!config) { document.getElementById(target).innerHTML = `<p style="text-align:center;">Очікування P${p}...</p>`; return; }
        let html = `<h3 style="text-align:center; color:#f1c40f; margin-bottom:10px;">${p===1?'🟦':'🟥'} ${config.name}</h3>`;
        Object.keys(config.units).forEach(k => {
            const u = config.units[k];
            html += `<div class="card">
                <div style="font-size:14px; font-weight:bold;">${u.name}</div>
                <img src="${u.img}" class="shopImg">
                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; font-size:10px; margin:5px 0; background:#dfe6e9; border-radius:4px; padding:2px;">
                    <span>❤️${u.hp}</span><span>⚔️${u.atk}</span><span>👟${u.speed}</span>
                </div>
                <button class="btn" style="padding:5px; font-size:14px;" onclick="window.setBuy('${k}')" ${playerId !== p || currentPlayer !== p ? 'disabled' : ''}>
                    🛒 ${u.price/1000}k
                </button>
            </div>`;
        });
        document.getElementById(target).innerHTML = html;
    };
    draw(1); draw(2);
}

window.setBuy = (k) => { buyMode = k; };
updateTeamList();
</script>
</body>
</html>
